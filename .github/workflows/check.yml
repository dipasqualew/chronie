name: check

# The same gate humans run locally (./scripts/check.sh), split so that Rust — which is most
# of the wall clock and all of the toolchain — stops holding the Lua and frontend suites
# behind a WebKit tree and a cache restore they have no use for.
#
# Two jobs, not three. A Free plan gets twenty concurrent jobs across the whole account, and
# with several branches in flight at once the rolling Windows release is the job that ends up
# waiting for a slot: it is the slowest to finish and nothing gives it priority. Lua and the
# frontend together are still shorter than Rust alone, so folding them into one runner costs
# this workflow nothing and hands a slot back.
#
# Pull requests only, plus main itself. Every branch here has a pull request open on it from
# its first push — running on `push` as well meant two runs of everything for the same
# commit, competing for runners and for the same Rust cache key.
on:
  push:
    branches: [main]
  pull_request:

# Only the newest commit on a ref is worth checking; superseded runs just queue behind it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What the tauri crate links against. The frontend is not built for a debug run — that
      # configuration points at `devUrl` — so this job needs no bun and no node_modules.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      # Without this the whole dependency tree (tauri, reqwest, bundled SQLite) is
      # recompiled from scratch on every push.
      #
      # Restored everywhere, written only from main. A repository gets ten gigabytes of
      # Actions cache and this archive is two and a half of them, so branches saving their own
      # copies filled the budget on their own: four debug caches holding 8.37 GB, and the
      # Windows release cache the rolling release depends on evicted down to a 0.71 GB stub
      # that restored in six seconds and left `tauri build` to compile the tree from nothing.
      # A pull request branch has no dependency tree of its own to cache anyway — main's is
      # the same one, minus whatever that branch changed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: ./scripts/check-rust.sh

  lua-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1; the rocks have to be built against it to match game semantics.
      # Nothing here needs the GTK and WebKit tree the desktop app links against.
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblua5.1-0-dev lua5.1 luarocks

      - name: Install luacheck and busted
        run: |
          sudo luarocks install luacheck
          sudo luarocks install busted

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install browser test dependencies
        run: node apps/desktop/node_modules/@playwright/test/cli.js install --with-deps chromium

      # The Lua suite first: it is four seconds, and a luacheck warning is worth hearing
      # before waiting on a browser.
      - run: ./scripts/check-lua.sh
      - run: ./scripts/check-frontend.sh
