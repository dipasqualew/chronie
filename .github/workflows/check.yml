name: check

# The same gate humans run locally (./scripts/check.sh): luacheck, busted, then the
# desktop backend and frontend suites. Runs on every push and pull request so the
# "zero warnings, zero failures" rule is enforced, not just remembered.
on:
  push:
  pull_request:

# Only the newest commit on a ref is worth checking; superseded runs just queue behind it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1; the rocks have to be built against it to match game semantics.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            liblua5.1-0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            lua5.1 \
            luarocks

      - name: Install luacheck and busted
        run: |
          sudo luarocks install luacheck
          sudo luarocks install busted

      # Without this the whole dependency tree (tauri, reqwest, bundled SQLite) is
      # recompiled from scratch on every push.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-debug
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install browser test dependencies
        run: node apps/desktop/node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run checks
        run: ./scripts/check.sh
