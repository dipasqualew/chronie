name: check

# The same gate humans run locally (./scripts/check.sh), split so that Rust — which is most
# of the wall clock — stops holding the Lua and frontend suites behind a toolchain and a cache
# restore they have no use for, and so that the Rust half can run on the operating system this
# application is actually for. Each job is on the platform its suite is about: Windows for the
# desktop backend, Linux for the two that are the same everywhere. See each for why.
#
# Two jobs, not three. A Free plan gets twenty concurrent jobs across the whole account, and
# with several branches in flight at once the rolling Windows release is the job that ends up
# waiting for a slot: it is the slowest to finish and nothing gives it priority. Lua and the
# frontend together are still shorter than Rust alone, so folding them into one runner costs
# this workflow nothing and hands a slot back.
#
# Pull requests only, plus main itself. Every branch here has a pull request open on it from
# its first push — running on `push` as well meant two runs of everything for the same
# commit, competing for runners and for the same Rust cache key.
on:
  push:
    branches: [main]
  pull_request:

# Only the newest commit on a ref is worth checking; superseded runs just queue behind it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chronie is a Windows application, so this is the job that runs where it ships. Paths, the
  # install root, the SavedVariables folder under it and everything the collector does to a
  # file are the half of this app an Ubuntu runner could only ever approximate, and until now
  # the only machine that compiled them for Windows did it after the merge, on the way to a
  # release nobody approves. It gates a pull request now, which is the point of a gate.
  #
  # It is also the cheaper of the two: no `apt-get` at all, because the webview here is
  # WebView2 rather than the GTK and WebKit tree Linux has to install, and standard runners
  # are free on a public repository whatever the operating system.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Without this the whole dependency tree (tauri, reqwest, bundled SQLite) is
      # recompiled from scratch on every push.
      #
      # Restored everywhere, written only from main. A repository gets ten gigabytes of
      # Actions cache and this archive is a couple of them, so branches saving their own
      # copies filled the budget on their own: four debug caches holding 8.37 GB, and the
      # release cache the rolling build depends on evicted down to a 0.71 GB stub that
      # restored in six seconds and left `tauri build` to compile the tree from nothing. A
      # pull request branch has no dependency tree of its own to cache anyway — main's is the
      # same one, minus whatever that branch changed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: ./scripts/check-rust.sh
        shell: bash

      # Installing Chronie is PowerShell now: `install.ps1` unpacks the release and writes
      # the shortcut and the uninstall entry itself, rather than handing an NSIS installer a
      # job Windows Defender will not let it do. `./scripts/check.sh` cannot check any of it —
      # it runs on the machines that have no PowerShell — so this runner, which is here
      # because it is the one Chronie ships on, is also the only one that can.
      #
      # A parse is not a test. It is the floor: `install.ps1` arrives through `irm | iex`, so
      # a syntax error is not a red build somewhere, it is somebody's half-installed machine.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($error in $errors) {
              $failed = $true
              $line = $error.Extent.StartLineNumber
              Write-Host "::error file=scripts/$($script.Name),line=$line::$($error.Message)"
            }
          }
          if ($failed) { exit 1 }

  # These two stay on Linux, and not out of habit. The addon's Lua never runs on the host
  # operating system at all — it runs inside the game client's own 5.1 interpreter, which is
  # the same interpreter whatever the machine underneath is — and Playwright drives Chromium
  # on either platform, not the WebView2 the packaged app actually shows. Moving them to
  # Windows would buy no coverage and cost a Lua 5.1 toolchain that apt hands over in ten
  # seconds and Windows does not.
  lua-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1; the rocks have to be built against it to match game semantics.
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblua5.1-0-dev lua5.1 luarocks

      - name: Install luacheck and busted
        run: |
          sudo luarocks install luacheck
          sudo luarocks install busted

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      # Keyed on the Playwright release, because that is what a downloaded browser belongs
      # to. Hashing `bun.lock` threw the browsers away every time any dependency in the tree
      # moved, which is most pushes, to re-download a Chromium that had not changed.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./apps/desktop/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restored everywhere, written only from main, for the reason the Rust cache above is:
      # the repository gets ten gigabytes and a branch has no browser of its own to cache.
      - name: Restore the Playwright browsers
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The Lua suite first: it is four seconds, and a luacheck warning is worth hearing
      # before waiting on a browser. It has been sitting below the browser install rather
      # than above it, so it was heard six minutes late.
      - run: ./scripts/check-lua.sh

      # No `--with-deps`, and that is where six minutes went. Every shared library Chromium
      # needs is already on the ubuntu-latest image — `fonts-liberation` included — so the
      # only thing apt had left to fetch was ten font packages for scripts this suite never
      # renders: Japanese, Chinese, Thai, Cyrillic and unifont. 21.1 MB, off an Azure mirror
      # serving 59.6 kB/s, to change nothing about how an English page draws.
      #
      # If a runner image ever does drop a library, Chromium fails to launch and says so.
      # That is a red build with a legible cause, which is worth more than six minutes a run.
      - name: Install the browser the suite drives
        run: node apps/desktop/node_modules/@playwright/test/cli.js install chromium

      - name: Save the Playwright browsers
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: ./scripts/check-frontend.sh
