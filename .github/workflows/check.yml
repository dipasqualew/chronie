name: check

# The same gate humans run locally (./scripts/check.sh): luacheck, busted, then the
# desktop backend and frontend suites. Runs on every push and pull request so the
# "zero warnings, zero failures" rule is enforced, not just remembered.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1; the rocks have to be built against it to match game semantics.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            liblua5.1-0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            lua5.1 \
            luarocks

      - name: Install luacheck and busted
        run: |
          sudo luarocks install luacheck
          sudo luarocks install busted

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test dependencies
        run: bun --bun x playwright install --with-deps chromium

      - name: Run checks
        run: ./scripts/check.sh
