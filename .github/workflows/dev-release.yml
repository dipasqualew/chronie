name: Rolling development release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      # The addon is compiled into the app and installed from it, so a change to the addon
      # only reaches anybody's game folder by way of a new desktop build.
      - "apps/addon/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dev-release.yml"

permissions:
  contents: write

concurrency:
  group: rolling-dev-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keyed on the release profile because the backend tests and the bundle below share
      # it, so the dependency tree is compiled once here and reused across pushes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Set rolling version and release configuration
        id: release-config
        shell: pwsh
        run: |
          $path = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $signed = [bool]$env:TAURI_SIGNING_PUBLIC_KEY `
            -and [bool]$env:TAURI_SIGNING_PRIVATE_KEY `
            -and [bool]$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          if ($signed) {
            $config.plugins.updater.pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            $config.plugins.PSObject.Properties.Remove("updater")
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content $path
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test frontend
        working-directory: apps/desktop
        run: bun run test

      - name: Test desktop experience
        working-directory: apps/desktop
        run: |
          node node_modules/@playwright/test/cli.js install chromium
          bun run test:e2e

      # Release profile on purpose: `tauri build` below compiles the same dependency tree,
      # and a debug run here would build every crate a second time for nothing.
      - name: Test backend
        run: cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build signed Windows installer
        working-directory: apps/desktop
        run: bun run tauri build

      - name: Replace rolling dev release
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS installer." }

          git tag --force dev $env:GITHUB_SHA
          git push --force origin refs/tags/dev
          gh release view dev *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev --prerelease --title "Development build" --notes "Rolling development build."
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/dev" | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
          }

          $assets = @($installer.FullName)
          if ("${{ steps.release-config.outputs.signed }}" -eq "true") {
            $updater = Get-ChildItem $bundle -Filter "*.nsis.zip" | Select-Object -First 1
            if (-not $updater) { throw "Tauri did not produce an NSIS updater bundle." }
            $signaturePath = "$($updater.FullName).sig"
            if (-not (Test-Path $signaturePath)) { throw "Tauri did not sign the updater artifact." }

            $assetName = $updater.Name
            $encodedName = [Uri]::EscapeDataString($assetName)
            $latest = @{
              version = $version
              notes = "Rolling development build from $env:GITHUB_SHA"
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content $signaturePath -Raw).Trim()
                  url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/dev/$encodedName"
                }
              }
            }
            $latest | ConvertTo-Json -Depth 8 | Set-Content latest.json
            $assets += $updater.FullName, $signaturePath, "latest.json"
          }
          gh release upload dev $assets --clobber
