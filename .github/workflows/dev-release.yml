name: Rolling development release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      # The addon is compiled into the app and installed from it, so a change to the addon
      # only reaches anybody's game folder by way of a new desktop build.
      - "apps/addon/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dev-release.yml"
      # Packed into the release archive, because `install.ps1` is piped in from the internet
      # and has nowhere else to get an uninstaller from. A change to it has to be published
      # like any other part of the build.
      - "scripts/uninstall.ps1"

permissions:
  contents: write

concurrency:
  group: rolling-dev-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The one cache that decides how long a release takes, and for a while the one the
      # `check` workflow kept evicting: with debug caches from every branch filling the
      # repository's ten gigabytes, this was restoring nothing and `tauri build` compiled 635
      # crates from scratch every time. `check` only writes from main now, which leaves room
      # for this.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set rolling version and release configuration
        id: release-config
        shell: pwsh
        run: |
          $path = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $signed = [bool]$env:TAURI_SIGNING_PUBLIC_KEY `
            -and [bool]$env:TAURI_SIGNING_PRIVATE_KEY `
            -and [bool]$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          if ($signed) {
            $config.plugins.updater.pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            $config.plugins.PSObject.Properties.Remove("updater")
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content $path
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # This job builds and publishes; it does not test. `check` has already run every suite
      # on the push to main that started this run, and what used to sit here was costing
      # eleven minutes to repeat it.
      #
      # `cargo test --release` used to be defended on the grounds that `tauri build` compiles
      # the same dependency tree, so the tests came for free. That stopped being true when
      # the OpenTelemetry dev-dependencies landed: `cargo test` resolves features across
      # dev-dependencies and `tauri build` does not, so `serde`, `syn`, `tracing`, `url` and
      # everything downstream of them — which is nearly the whole tree, tauri included — got
      # a different fingerprint and were compiled twice. 10m44s, then 5m11s, on one runner.
      #
      # The Windows coverage that used to justify it — paths, the install root, the
      # SavedVariables folder under it — did not go anywhere. It moved to `check`, where it
      # runs on windows-latest against the pull request, which is somewhere it gates something.
      # Here it never did: it ran after the merge, on the way to a release nobody approves,
      # and a failure only meant the installer quietly did not appear.
      - name: Build signed Windows installer
        working-directory: apps/desktop
        run: bun run tauri build

      # What a person downloads, and the only asset that is any use to them. The NSIS
      # installer beside it is still built — the updater has no other shape to ship in — but
      # it is not published, because Windows Defender refuses to let anyone run it: it
      # signatures the NSIS stub that every self-extracting installer is built from, not
      # anything in Chronie, and an unsigned one is blocked on download and again on launch
      # (issue #135). A zip has no stub. `scripts/install.ps1` unpacks this one itself.
      #
      # The build is a single executable — the frontend, the icons and the addon are all
      # compiled into it — so the archive is that plus the uninstaller, which has to travel
      # with it because `install.ps1` is piped in from the internet with no checkout beside
      # it to copy from.
      - name: Pack the portable archive
        id: portable
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          foreach ($key in "resources", "externalBin") {
            if ($config.bundle.PSObject.Properties.Name -contains $key) {
              throw "bundle.$key means the app is more than one file now; teach this step to pack the rest."
            }
          }

          # Cargo names the binary after the Cargo package — `chronie-desktop` — and it is
          # tauri's bundler, which this deliberately skips, that renames it to `productName`
          # on the way into an installer. So the built name is asked for rather than assumed,
          # and the copy into the archive is what does the renaming instead.
          $metadata = cargo metadata --format-version 1 --no-deps `
            --manifest-path apps/desktop/src-tauri/Cargo.toml | ConvertFrom-Json
          $binary = $metadata.packages[0].targets |
            Where-Object { $_.kind -contains "bin" } | Select-Object -First 1
          if (-not $binary) { throw "The desktop crate has no binary target." }

          $built = Join-Path $metadata.target_directory "release/$($binary.name).exe"
          if (-not (Test-Path $built)) { throw "The build did not produce $built." }

          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          $payloadName = "$($config.productName).exe"
          $staging = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $built (Join-Path $staging $payloadName) -Force
          Copy-Item "scripts/uninstall.ps1" $staging -Force

          $archiveName = "$($config.productName)_${version}_x64-portable.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Replace rolling dev release
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"

          git tag --force dev $env:GITHUB_SHA
          git push --force origin refs/tags/dev
          gh release view dev *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev --prerelease --title "Development build" --notes "Rolling development build."
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/dev" | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
          }

          $assets = @("${{ steps.portable.outputs.archive }}")
          # Nobody has configured a signing key, so this branch has never run. When somebody
          # does, read issue #135 first: what the updater downloads and runs is the NSIS
          # installer, wrapped in a zip, and that is the artifact Windows Defender refuses.
          # Automatic updates need a code-signing certificate before they need this.
          if ("${{ steps.release-config.outputs.signed }}" -eq "true") {
            $updater = Get-ChildItem $bundle -Filter "*.nsis.zip" | Select-Object -First 1
            if (-not $updater) { throw "Tauri did not produce an NSIS updater bundle." }
            $signaturePath = "$($updater.FullName).sig"
            if (-not (Test-Path $signaturePath)) { throw "Tauri did not sign the updater artifact." }

            $assetName = $updater.Name
            $encodedName = [Uri]::EscapeDataString($assetName)
            $latest = @{
              version = $version
              notes = "Rolling development build from $env:GITHUB_SHA"
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content $signaturePath -Raw).Trim()
                  url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/dev/$encodedName"
                }
              }
            }
            $latest | ConvertTo-Json -Depth 8 | Set-Content latest.json
            $assets += $updater.FullName, $signaturePath, "latest.json"
          }
          gh release upload dev $assets --clobber
