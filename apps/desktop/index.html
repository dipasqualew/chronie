<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronie</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f6f5f2;
    --surface-1: #fcfcfb;
    --surface-2: #efeeea;
    --border: #dedcd5;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #85837c;
    --series-1: #2a78d6;
    --series-1-soft: #cde2fb;
    --grid: #e6e4dd;
    --gold: #a67c00;
    --ok: #2f8f57;
    --bad: #c65a5a;
    --shadow: 0 1px 2px rgba(11, 11, 11, .06), 0 8px 24px rgba(11, 11, 11, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --border: #34342f;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8d8c83;
      --series-1: #3987e5;
      --series-1-soft: #184f95;
      --grid: #2a2a27;
      --gold: #e0b64a;
      --ok: #59d973;
      --bad: #e07b7b;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --border: #34342f;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8d8c83;
    --series-1: #3987e5;
    --series-1-soft: #184f95;
    --grid: #2a2a27;
    --gold: #e0b64a;
    --ok: #59d973;
    --bad: #e07b7b;
    --shadow: none;
  }

  /* ---------- the class palette ---------- */

  /* The client's own thirteen colours, so a character reads here the way they do in game,
     and beside each the ink that can be written on it: no single one clears priest white
     and shaman blue both, so each is the near-black or the white that reaches WCAG 4.5:1
     against its fill. `ui.test.ts` reads these rules back and re-measures that.

     They live in the stylesheet, rather than being handed to it a character at a time,
     because the packaged app's CSP carries a nonce in `style-src` — Tauri puts it there —
     and a nonce makes every browser ignore `'unsafe-inline'`. A `style=""` attribute has
     nowhere to carry a nonce, so a colour sent that way never arrives: that is what left
     three attempts at these colours green in the tests and grey in the window. A
     `data-class` the stylesheet matches on cannot be dropped by a policy.

     The bare `[data-class]` first is the fallback, and it is deliberately a rule rather
     than a `var()` default: a segment whose class nothing knows would otherwise inherit
     the colour of whoever led the session and quietly claim to be them. */
  [data-class] { --class-color: var(--text-muted); --class-ink: #0b0b0b; }
  [data-class="DEATHKNIGHT"] { --class-color: #c41e3a; --class-ink: #ffffff; }
  [data-class="DEMONHUNTER"] { --class-color: #a330c9; --class-ink: #ffffff; }
  [data-class="DRUID"]       { --class-color: #ff7c0a; --class-ink: #0b0b0b; }
  [data-class="EVOKER"]      { --class-color: #33937f; --class-ink: #0b0b0b; }
  [data-class="HUNTER"]      { --class-color: #aad372; --class-ink: #0b0b0b; }
  [data-class="MAGE"]        { --class-color: #3fc7eb; --class-ink: #0b0b0b; }
  [data-class="MONK"]        { --class-color: #00ff98; --class-ink: #0b0b0b; }
  [data-class="PALADIN"]     { --class-color: #f48cba; --class-ink: #0b0b0b; }
  [data-class="PRIEST"]      { --class-color: #ffffff; --class-ink: #0b0b0b; }
  [data-class="ROGUE"]       { --class-color: #fff468; --class-ink: #0b0b0b; }
  [data-class="SHAMAN"]      { --class-color: #0070dd; --class-ink: #ffffff; }
  [data-class="WARLOCK"]     { --class-color: #8788ee; --class-ink: #0b0b0b; }
  [data-class="WARRIOR"]     { --class-color: #c69b6d; --class-ink: #0b0b0b; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 24px 64px;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  [hidden] { display: none !important; }

  h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); font-size: 13px; }
  .muted { color: var(--text-muted); }
  .gold { color: var(--gold); font-weight: 550; }
  .loss { color: var(--bad); font-weight: 550; }
  .ok { color: var(--ok); font-weight: 550; }
  .appearance-new { color: var(--ok); }
  .appearance-variant { color: #b373ff; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
    background: var(--surface-2); border-radius: 4px; padding: 1px 5px;
  }

  button {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px; cursor: pointer;
  }
  button:hover { background: var(--surface-2); }
  button.primary { color: white; background: var(--series-1); border-color: var(--series-1); }
  button:disabled { cursor: default; opacity: .4; }
  button:focus-visible, .circle:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  /* Clear of the rings the circle already wears, or the focus ring reads as one of them. */
  .circle:focus-visible { outline-offset: 4px; }
  input, select {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  /* ---------- app bar ---------- */

  /* Wrapping, because the bar now carries the build as well as a tab for every view, and the
     two together clear the narrowest window the app allows by about thirty pixels. That is
     close enough that a longer channel name or a larger system font would not, and a tab
     pushed off the right-hand edge is a view with no way into it. */
  .appbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin-bottom: 22px; }
  .appbar .brand { font-weight: 700; letter-spacing: -0.01em; }
  /* The build, beside the name it belongs to, and it is the version that holds the tabs off to
     the right — so a build with no commit to show does not drag the whole bar back with it. */
  .appbar .version {
    margin-right: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--text-muted);
  }
  .appbar .version a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  .appbar .version a:hover { color: var(--text-primary); }
  .appbar button { border-radius: 999px; padding: 6px 14px; }

  header.view-head { margin-bottom: 18px; }

  /* ---------- the timeline spine ---------- */

  .spine { position: relative; padding-left: 34px; }
  .spine::before {
    content: ""; position: absolute; left: 11px; top: 4px; bottom: 4px; width: 2px;
    background: linear-gradient(to bottom, transparent, var(--border) 40px,
      var(--border) calc(100% - 40px), transparent);
  }
  .spine-day {
    position: sticky; top: 0; z-index: 3;
    margin: 20px 0 12px -34px; padding: 8px 0 6px;
    background: linear-gradient(var(--surface-0) 72%, transparent);
  }
  .spine-day:first-child { margin-top: 0; }
  .spine-day span {
    display: inline-block; font-size: 11px; font-weight: 650;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 12px;
  }

  .session { position: relative; margin-bottom: 12px; }
  .session-node {
    position: absolute; left: -30px; top: 19px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--class-color);
    box-shadow: 0 0 0 4px var(--surface-0), 0 0 0 5px var(--border);
  }
  .session-card { padding: 14px 16px 12px; border-left: 3px solid var(--class-color); }

  .session-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 11px; }
  .session-when { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .session-clock {
    font-size: 15px; font-weight: 620; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .session-cast { display: flex; padding-left: 8px; }
  /* The overlap is measured against the rings, not the disc: they stand 3px proud of it on
     each side, and the -9px this used to be buried the initials of everyone but the last. */
  .session-cast .circle + .circle { margin-left: -3px; }
  .session-time { margin-left: auto; text-align: right; line-height: 1.25; }
  .session-played {
    display: block; font-size: 19px; font-weight: 640;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .session-elapsed { font-size: 11.5px; color: var(--text-muted); }
  .session-quiet { color: var(--text-muted); font-size: 13px; margin: 0; }

  /* ---------- what was done ---------- */

  /* The activities lead the card, so they are the one thing on it drawn as rows rather than
     as chips: a row can carry a level, a dungeon and a verdict without any of the three
     having to be abbreviated away, and four keys in an evening read as four keys.

     They wear the class colour the way a segment row does — a rail and a wash that has faded
     before the time on the right — because an evening across three characters is exactly
     when "who did this one" is worth answering without reading a word. */
  .act-roll { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 3px; }
  .act {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px;
    align-items: baseline; width: 100%; text-align: left; padding: 7px 10px 7px 13px;
    border: none; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;
    --class-wash: linear-gradient(to right,
      color-mix(in srgb, var(--class-color) 20%, transparent), transparent 46%);
    background: var(--class-wash);
    box-shadow: inset 3px 0 0 var(--class-color), inset 4px 0 0 var(--border);
  }
  .act:hover { background: var(--class-wash), var(--surface-2); }
  /* A guess Chronie was unsure about, marked the way an activity chip marks one: dashed,
     so "Chronie thinks" and "I said so" can be told apart without hovering either. */
  .act.guess { outline: 1px dashed var(--border); outline-offset: -1px; }
  .act-icon { font-size: 14px; line-height: 1; }
  .act-body { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .act-name { font-weight: 570; }
  .act-detail { color: var(--text-secondary); font-size: 12px; }
  .act-who { color: var(--text-secondary); font-size: 12px; }
  .act-time { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .circle {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-grid; place-items: center;
    font-size: 10px; font-weight: 700; letter-spacing: .03em;
    /* Filled with the class colour outright, not washed with it: a 22% tint over the card
       left every circle the colour of the page, which is the same as no colour at all.
       The two rings hold a stacked cast apart and give a priest's white an edge. */
    background: var(--class-color);
    border: 2px solid var(--class-color);
    color: var(--class-ink);
    box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 3px var(--border);
    cursor: default; flex: none;
  }

  /* ---------- highlights ---------- */

  .hl-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .hl {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; line-height: 1.4;
    padding: 4px 11px 4px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-primary); text-align: left;
  }
  button.hl { cursor: pointer; }
  button.hl:hover { border-color: var(--series-1); background: var(--series-1-soft); }
  .hl-icon { font-size: 13px; line-height: 1; }
  .hl .detail { color: var(--text-muted); }
  .hl-caret { font-size: 9px; color: var(--text-muted); margin-left: 1px; }
  .hl.open { border-color: var(--series-1); background: var(--series-1-soft); }
  .hl.open .hl-caret { color: var(--text-secondary); }

  /* What a summary unfolds into. Capped and scrolled rather than allowed to run: a session
     with sixty quests in it should still be a card, not a page. */
  .hl-panel {
    list-style: none; margin: 8px 0 0; padding: 6px;
    max-height: 232px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
    display: grid; gap: 1px;
  }
  .hl-item {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    width: 100%; text-align: left; padding: 4px 8px;
    border: none; border-radius: 6px; background: transparent;
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .hl-item:hover { background: var(--surface-1); }
  .hl-item-name { color: var(--text-primary); }
  .hl-item-meta { margin-left: auto; font-size: 11px; color: var(--text-muted); }
  /* A tint for the three that are genuinely rare, so an evening with one is visible from
     across the room; everything else stays neutral or the tinting means nothing. */
  .hl-achievement { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface-1)); }
  .hl-levelUp { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface-1)); }
  .hl-mount { border-color: #b373ff; background: color-mix(in srgb, #b373ff 14%, var(--surface-1)); }

  /* The running numbers are one mark apiece, and the numbers themselves live in the hover.
     A night that touched five factions used to end in five lines of name and number under a
     card whose job is to say what happened; this is that strip reduced to what it is worth
     at a glance, which is "there was gold, there was reputation". */
  .tally-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border);
  }
  .tally {
    display: inline-grid; place-items: center;
    width: 24px; height: 24px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-2);
    font-size: 12px; line-height: 1; cursor: default;
  }
  .tally:hover, .tally:focus-visible { border-color: var(--series-1); background: var(--series-1-soft); }
  #tooltip .tip-line { display: block; font-variant-numeric: tabular-nums; }

  /* A chip that has given its words to the hover keeps its icon centred rather than sitting
     where the label used to start, or a row of them comes out visibly ragged. */
  .hl-quiet { padding: 4px 8px; }

  .session-toggle {
    margin-top: 10px; padding: 3px 0; border: none; background: transparent;
    color: var(--text-secondary); font-size: 12px; display: inline-flex; gap: 6px; align-items: center;
  }
  .session-toggle:hover { background: transparent; color: var(--text-primary); }
  .session-toggle .caret { color: var(--text-muted); }

  .session-segments {
    list-style: none; margin: 6px 0 0; padding: 6px 0 0;
    border-top: 1px solid var(--border); display: grid; gap: 2px;
  }
  /* A segment carries its own character's class colour, quietly: a rail down the left edge
     and a wash that has faded out by a third of the way across. Quietly is the point — the
     row is already a time, a name, a place and a summary, and the colour is there to let an
     evening's characters be told apart at a glance, not to be read.

     The rail wears a hairline on its inner side for the same reason the circle does: priest
     is #ffffff, and a rail in it against the card would read as a gap rather than a colour. */
  .seg {
    display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: start;
    width: 100%; text-align: left; padding: 7px 8px 7px 13px;
    border: none; border-radius: 8px;
    --class-wash: linear-gradient(to right,
      color-mix(in srgb, var(--class-color) 18%, transparent), transparent 38%);
    background: var(--class-wash);
    box-shadow: inset 3px 0 0 var(--class-color), inset 4px 0 0 var(--border);
  }
  /* The wash is named above so that hovering can lay the hover surface *under* it rather
     than replace it — a row that lost its colour on the way to being clicked would be the
     one place the colour mattered most. */
  .seg:hover { background: var(--class-wash), var(--surface-2); }
  .seg-time { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .seg-body { min-width: 0; }
  .seg-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .seg-who { font-weight: 550; }
  .seg-where { color: var(--text-secondary); }
  .seg-activities { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; font-size: 11px; }
  /* The same summary as the session's, a size down: on a segment row it is the supporting
     line, and drawn at full size it would compete with the place and the character. */
  .seg-summary { display: block; margin-top: 5px; }
  .seg-summary .hl-row { gap: 4px; }
  .seg-summary .hl { font-size: 11px; padding: 2px 8px 2px 7px; }
  .seg-summary .hl-icon { font-size: 11px; }
  .seg-dur { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; padding-top: 2px; }

  /* ---------- the characters roster ---------- */

  /* The roster stays beside its character rather than above them: picking somebody is a
     thing a reader does repeatedly, and a list that scrolled away on every pick would make
     comparing two characters a matter of memory. It stacks below 900px, where two columns
     would leave neither of them readable. */
  .roster { display: grid; grid-template-columns: minmax(230px, 300px) 1fr; gap: 14px; align-items: start; }
  .roster-panel { padding: 8px; position: sticky; top: 8px; max-height: calc(100vh - 48px); overflow-y: auto; }
  .roster-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  @media (max-width: 900px) {
    .roster { grid-template-columns: 1fr; }
    .roster-panel { position: static; max-height: none; }
  }

  /* An entry wears its class the way a segment row does — a rail and a wash that has faded
     out before the numbers — so the roster reads as the same kind of thing as the rows it
     opens. The chosen one is ringed rather than filled: the wash is already spoken for. */
  .roster-entry {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center;
    width: 100%; text-align: left; padding: 8px 10px 8px 13px;
    border: none; border-radius: 8px;
    --class-wash: linear-gradient(to right,
      color-mix(in srgb, var(--class-color) 18%, transparent), transparent 62%);
    background: var(--class-wash);
    box-shadow: inset 3px 0 0 var(--class-color), inset 4px 0 0 var(--border);
  }
  .roster-entry:hover { background: var(--class-wash), var(--surface-2); }
  .roster-entry[aria-pressed="true"] {
    background: var(--class-wash), var(--surface-2);
    box-shadow: inset 3px 0 0 var(--class-color), inset 4px 0 0 var(--border),
      0 0 0 1px var(--series-1);
  }
  .roster-who { display: grid; min-width: 0; }
  .roster-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster-class { font-size: 11.5px; }
  .roster-numbers { display: grid; text-align: right; line-height: 1.3; }
  .roster-played { font-weight: 620; font-variant-numeric: tabular-nums; }
  .roster-numbers .muted { font-size: 11px; }

  .roster-detail { padding: 16px; }
  .profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .profile-head .circle { width: 40px; height: 40px; font-size: 13px; }
  .profile-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .profile-head p { margin: 2px 0 0; }
  .profile-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px;
    margin: 0 0 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2);
  }
  .profile-stats dt { font-size: 11px; color: var(--text-muted); }
  .profile-stats dd {
    margin: 2px 0 0; font-size: 15px; font-weight: 620; font-variant-numeric: tabular-nums;
  }
  .profile-where { margin: 0 0 12px; }
  .profile-segments h4 {
    margin: 12px 0 4px; font-size: 11px; font-weight: 650; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .profile-day:first-of-type h4 { margin-top: 4px; }
  .segment-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }

  /* ---------- chips and badges ---------- */

  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-2);
    vertical-align: baseline;
  }
  .chip {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: var(--surface-2); color: var(--text-secondary);
  }
  .chip.activity {
    background: transparent; border: 1px solid var(--series-1);
    color: var(--text-primary); font-weight: 550;
  }
  .chip.activity.guess { border-style: dashed; color: var(--text-secondary); }
  .chip.activity .detail { font-weight: 400; color: var(--text-secondary); }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; vertical-align: baseline;
    background: var(--class-color);
  }

  .empty { padding: 44px 16px; text-align: center; color: var(--text-muted); }
  .empty p { max-width: 42ch; margin: 0 auto; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px !important; }

  /* ---------- details table ---------- */

  .table-head { padding: 16px 16px 0; }
  .table-head h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .table-head .sub { margin-bottom: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .count { color: var(--text-muted); font-size: 12px; margin-left: auto; }
  .scroller { overflow-x: auto; padding: 0 4px 4px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th {
    position: sticky; top: 0; z-index: 1;
    background: var(--surface-1); color: var(--text-secondary);
    font-size: 12px; font-weight: 600; cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text-primary); }
  th .arrow { color: var(--series-1); font-size: 10px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  td.num { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .row-open {
    border: none; background: transparent; padding: 0; font: inherit;
    color: inherit; text-align: left;
  }
  tbody tr:hover .row-open { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- query ---------- */

  /* What is in the database down the left, what is being asked of it on the right. The list
     is narrow because it is a reference rather than the subject: a query several lines long
     needs the width more than a column called `duration_seconds` does. */
  .query-body {
    display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 16px; align-items: start;
  }
  /* A window too narrow for both puts the tables above the editor rather than squeezing
     them, the same bargain the transmog view makes with its character. */
  @media (max-width: 880px) { .query-body { grid-template-columns: 1fr; } }

  .query-tables {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 12px 14px; max-height: 72vh; overflow: auto;
  }
  .query-tables h2 {
    font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 0 8px;
  }
  .query-table summary {
    cursor: pointer; padding: 3px 0; font-size: 13px; font-weight: 550;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  /* `display: flex` on a summary takes its disclosure triangle away in WebKit, so the
     marker is put back explicitly — it is the only thing saying the row opens. */
  .query-table summary::marker, .query-table summary::-webkit-details-marker { content: none; }
  .query-table summary::before { content: "▸"; color: var(--text-muted); font-size: 10px; }
  .query-table[open] summary::before { content: "▾"; }
  .query-table summary > .muted { margin-left: auto; font-size: 11px; }
  .query-tables ul { list-style: none; margin: 2px 0 10px; padding: 0 0 0 14px; }
  .query-tables li {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 12px;
  }
  /* A name that writes itself into the editor. Drawn as text rather than as a control: a
     sidebar of forty buttons in boxes is a wall, and every one of these is one word. */
  .query-tables li button {
    border: none; background: transparent; padding: 1px 0; font: inherit;
    color: var(--text-primary); text-align: left; border-radius: 4px;
  }
  .query-tables li button:hover {
    background: transparent; color: var(--series-1);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .query-tables .query-seed {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: var(--text-muted) !important; margin-bottom: 2px;
  }

  .query-main { display: flex; flex-direction: column; gap: 12px; }
  .query-recipes { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .query-recipes > .muted { font-size: 12px; }
  .chip.recipe {
    border: 1px solid var(--border); background: var(--surface-1); padding: 3px 9px;
    font-size: 12px; cursor: pointer;
  }
  .chip.recipe:hover { border-color: var(--series-1); color: var(--text-primary); }

  .query-editor {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; line-height: 1.55; tab-size: 2;
    color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    padding: 12px 14px; width: 100%; box-sizing: border-box; resize: vertical;
  }
  .query-editor:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

  .query-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .query-bar > .muted { font-size: 11px; }
  .query-limit {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-secondary); font-size: 12px;
  }
  .query-limit select { padding: 4px 7px; font-size: 12px; }
  .query-summary {
    margin-left: auto; color: var(--text-muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  /* SQLite's own words, in SQLite's own shape: the message names a column or a position in
     the statement, and a proportional font is the wrong thing to read that in. */
  .query-failure {
    margin: 0; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--bad); color: var(--bad);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  .query-truncated { margin: 0; color: var(--text-secondary); font-size: 12.5px; }

  .query-chart {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 12px 14px 8px;
  }
  .query-chart > .muted { margin: 4px 0; font-size: 13px; }
  .query-axes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .query-axes label {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-muted); font-size: 12px;
  }
  .query-axes select { padding: 4px 7px; font-size: 12px; max-width: 22ch; }
  .query-axes > .muted { font-size: 12px; }

  /* The drawing scales with the panel and keeps its proportions; every colour in it is a
     class, because a nonce in `style-src` drops the `style` attribute a chart would
     otherwise reach for. */
  .chart { display: block; width: 100%; height: auto; margin-top: 8px; }
  .chart-grid { stroke: var(--grid); stroke-width: 1; }
  .chart-axis { stroke: var(--border); stroke-width: 1; }
  .chart-tick { fill: var(--text-muted); font-size: 11px; }
  .chart-axis-label { fill: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .chart-bar { fill: var(--series-1); }
  .chart-bar:hover { fill: var(--text-primary); }
  .chart-line {
    fill: none; stroke: var(--series-1); stroke-width: 2;
    stroke-linejoin: round; stroke-linecap: round;
  }
  .chart-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 1.5; }
  .chart-dot:hover { stroke: var(--text-primary); stroke-width: 2.5; }

  .query-rows {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); max-height: 60vh; overflow: auto;
  }
  .query-rows table { font-size: 12.5px; }
  /* The details table sorts on a header click and this one does not, so it does not offer. */
  .query-rows th, .query-rows tbody tr { cursor: default; }
  .query-rows th.num { text-align: right; }
  .query-rows th:hover { color: var(--text-secondary); }
  .query-rows tbody tr:hover { background: var(--surface-2); }
  .query-rows td { max-width: 46ch; overflow: hidden; text-overflow: ellipsis; }
  .query-rows > .muted { margin: 0; padding: 14px; font-size: 13px; }

  /* ---------- transmog ---------- */

  .mog-list { padding: 0 16px 16px; }
  .mog-group + .mog-group { margin-top: 22px; }
  .mog-group h3 {
    font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 9px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .mog-group h3 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .mog-grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  }
  .mog-card {
    border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px;
    background: var(--surface-2); display: flex; flex-direction: column; gap: 8px;
  }
  /* An opened set holds its own contents and stops being a tile on the grid: it runs the
     full width so its rows are readable, and the sets after it close up around it. */
  .mog-card[data-open="true"] {
    grid-column: 1 / -1; border-color: var(--series-1); background: var(--surface-1);
  }
  .mog-card h4 {
    margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.35;
    /* Set names run long and the cards have to stay on a grid, so let them wrap twice. */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mog-open {
    border: none; background: transparent; padding: 0; font: inherit;
    color: inherit; text-align: left; cursor: pointer;
  }
  .mog-open:hover, .mog-card:hover .mog-open {
    background: transparent; text-decoration: underline; text-underline-offset: 3px;
  }
  .mog-card:hover { border-color: var(--series-1); }
  .mog-facts { display: flex; flex-wrap: wrap; gap: 4px; }
  .mog-foot {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: auto; font-size: 12px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .mog-contents { border-top: 1px solid var(--border); padding-top: 8px; }
  .mog-contents-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .mog-wear-all {
    margin-left: auto; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: inherit; font: inherit; font-size: 12px;
    padding: 3px 9px; cursor: pointer;
  }
  .mog-wear-all:hover { border-color: var(--series-1); }
  .mog-hide {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text-secondary); cursor: pointer; white-space: nowrap;
  }
  .mog-hide input { margin: 0; cursor: pointer; }

  /* The two halves that do not move: the sets are scrolled through and the character is not.
     Sticky rather than fixed so the panel scrolls with the page's own header and then stays,
     which is what "on screen at all times" means once the window is short.

     The character is the subject of this view, so her half takes a third of a wide window and
     the whole of its height — a 300px stage in a 330px column showed a body the size of a
     thumbnail beside a list that had room to spare. The sets grid reflows to whatever is
     left, which is what `auto-fill` was for. */
  .mog-layout {
    display: grid; gap: 12px; align-items: start;
    grid-template-columns: minmax(0, 1fr) clamp(360px, 34vw, 620px);
  }
  .mog-browser { min-width: 0; }
  /* The left half is two browsers and the switch above them, stacked — so the switch sits in
     the same place whichever of them is showing, and neither of them moves when it changes. */
  .mog-half { display: grid; gap: 10px; min-width: 0; align-content: start; }
  .mog-modes { display: flex; gap: 4px; }
  .mog-modes button {
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1);
    color: var(--text-secondary); font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 5px 14px; cursor: pointer;
  }
  .mog-modes button:hover { color: var(--text-primary); border-color: var(--series-1); }
  .mog-modes button[aria-pressed="true"] {
    background: var(--surface-2); color: var(--text-primary); border-color: var(--series-1);
  }
  /* A kind of place is thousands of looks, and the button under them is the honest version of
     an endless scroll: it says how many more there are before it fetches any of them. */
  .mog-more {
    display: block; width: 100%; margin-top: 8px;
    border: 1px dashed var(--border); border-radius: 8px; background: none;
    color: var(--text-secondary); font: inherit; font-size: 12px; padding: 7px; cursor: pointer;
  }
  .mog-more:hover { color: var(--text-primary); border-color: var(--series-1); border-style: solid; }
  .outfit {
    position: sticky; top: 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1);
    display: flex; flex-direction: column; gap: 10px; padding: 12px;
    height: calc(100vh - 24px); overflow: hidden;
  }
  /* A window narrow enough that two columns would squeeze both puts the character above the
     sets rather than beside them, and she stays at the top of the scroll. Nothing is sticky
     there, so the panel is as tall as it needs to be and the page does the scrolling. */
  @media (max-width: 900px) {
    .mog-layout { grid-template-columns: minmax(0, 1fr); }
    .outfit { position: static; height: auto; overflow: visible; }
    .outfit-preview { min-height: 60vh; }
  }
  /* The stage takes every pixel the panel is not using for the name box and the line under it,
     and nothing that grows as she is dressed is allowed into this column — see `.outfit-worn`.
     Two rows: the character, and whatever the pane has to say about her. */
  .outfit-preview {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 6px;
    flex: 1 1 auto; min-height: 320px;
  }
  /* The character and everything drawn over her: the rail of what she has on, and the way back
     to where the camera started. Both are out of the flow, so neither costs her any height. */
  .outfit-body { position: relative; justify-self: stretch; width: 100%; height: 100%; min-height: 0; }
  /* Out of the flow rather than in a row of its own, so that offering the way back does not
     cost the character the height the button takes. */
  .outfit-reset {
    position: absolute; top: 6px; right: 6px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: var(--text-secondary); font: inherit;
    font-size: 11.5px; padding: 3px 8px; cursor: pointer;
  }
  .outfit-reset:hover { color: var(--text-primary); border-color: var(--series-1); }
  .outfit-stage { width: 100%; height: 100%; min-height: 0; }
  .outfit-stage canvas { display: block; width: 100%; height: 100%; }
  .outfit-preview[data-state="empty"] .outfit-stage,
  .outfit-preview[data-state="loading"] .outfit-stage { visibility: hidden; }
  .outfit-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .outfit-head h3 {
    margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-secondary);
  }
  .outfit-clear {
    margin-left: auto; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: inherit; font: inherit; font-size: 12px;
    padding: 3px 8px; cursor: pointer;
  }
  /* What she has on, down her left. A column of named rows under the stage grew by a row for
     every piece and took that height out of the character, which is backwards: dressing her is
     the errand, and it was making the picture of her worse the further it got. So the pieces
     are over her instead — head downwards in the order the body reads — and a second column of
     them starts beside the first rather than the rail ever running off the bottom.

     The rail itself does not take the pointer: a drag that starts in the gap between two tiles
     is a drag on the character behind them, and only the tiles themselves are clicks. */
  .outfit-worn {
    position: absolute; inset: 0 auto 0 0; margin: 0; padding: 6px; list-style: none;
    display: flex; flex-flow: column wrap; align-content: flex-start; gap: 4px;
    pointer-events: none;
  }
  .outfit-slot { pointer-events: auto; }
  /* The tile is the control, and the cross under the pointer is what says so. Solid behind the
     picture because it is over a lit 3D scene rather than the panel, and an icon with the
     character's shoulder showing through it is not an icon. */
  .outfit-off {
    display: block; position: relative; margin: 0; padding: 0; border: 0;
    background: none; cursor: pointer;
  }
  .outfit-off .mog-icon { display: block; background: var(--surface-1); }
  .outfit-off:hover .mog-icon, .outfit-off:focus-visible .mog-icon { border-color: var(--bad); }
  .outfit-off::after {
    content: "×"; position: absolute; top: -5px; right: -5px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--bad); color: var(--surface-0);
    font-size: 12px; line-height: 15px; text-align: center; opacity: 0;
  }
  .outfit-off:hover::after, .outfit-off:focus-visible::after { opacity: 1; }
  .outfit-empty { margin: 0; font-size: 12px; }
  /* The name box that turns what she has on into a set of the reader's own. One row, because
     it is one field and one button; the sentence it answers with wraps under both. */
  .outfit-save { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .outfit-save .outfit-name {
    flex: 1 1 120px; min-width: 0; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: inherit; font: inherit; font-size: 12px;
    padding: 4px 8px;
  }
  .outfit-keep {
    flex: none; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: inherit; font: inherit; font-size: 12px;
    padding: 4px 10px; cursor: pointer;
  }
  .outfit-keep:hover { border-color: var(--series-1); }
  .outfit-save .muted, .outfit-save .mark-failure { flex: 1 0 100%; font-size: 11.5px; }
  /* The one control in this view that destroys something, and the only one behind a second
     click — so it is drawn as an aside rather than as a button competing with "wear all of". */
  .mog-confirm { display: flex; gap: 6px; align-items: baseline; }
  .mog-delete {
    border: 0; background: none; padding: 2px 4px;
    color: var(--text-secondary); font: inherit; font-size: 12px; cursor: pointer;
  }
  .mog-delete:hover { color: var(--bad); text-decoration: underline; }
  .mog-confirm .mog-delete { color: var(--bad); }

  /* ---------- settings ---------- */

  /* A rail and a pane. The rail is narrow enough that the pane still gets a readable
     measure, and sticky so a long category does not scroll its own navigation away. */
  .settings-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; align-items: start; }
  .settings-rail { display: grid; gap: 2px; position: sticky; top: 8px; }
  .settings-rail button {
    text-align: left; background: transparent; border-color: transparent;
    color: var(--text-secondary); padding: 8px 11px;
  }
  .settings-rail button:hover { background: var(--surface-2); }
  .settings-rail button[aria-current="true"] {
    background: var(--surface-1); border-color: var(--border);
    color: var(--text-primary); font-weight: 600;
  }
  /* Two panels share the combat-log category, and this is the gap between them. */
  .settings-sections { display: grid; gap: 18px; }
  @media (max-width: 820px) {
    .settings-layout { grid-template-columns: 1fr; }
    .settings-rail {
      position: static; grid-auto-flow: column; grid-auto-columns: max-content;
      overflow-x: auto; padding-bottom: 4px;
    }
  }

  .setup { padding: 18px; }
  .setup h2 { font-size: 16px; margin: 0 0 4px; }
  .setup h2 + .sub { margin: 0 0 4px; }
  /* The line between "this is one panel" and "this is one decision inside it". */
  .setup-subhead {
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-secondary); margin: 22px 0 4px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }

  /* ---------- screenshots ---------- */

  .capture-group { margin-top: 14px; }
  .capture-group h4 { margin: 0 0 2px; font-size: 13px; color: var(--text-secondary); }
  /* A box, then the moment it is about, then what that costs. The box is pulled to the top
     line rather than centred, because the label beside it is two or three lines tall. */
  .setup label.capture-choice {
    display: flex; align-items: flex-start; gap: 9px; margin: 0; padding: 6px 0;
    font-size: 14px; color: var(--text-primary); cursor: pointer;
  }
  .setup label.capture-choice input { width: 15px; height: 15px; margin-top: 3px; flex: none; cursor: pointer; }
  .setup label.capture-choice .sub { display: block; }
  /* A rule a broader one already covers is still on, and still yours to untick — it is just
     not doing anything on its own, and the line saying so is not a warning. */
  .capture-covered { font-style: italic; }
  .capture-quality { border: 0; padding: 0; margin: 12px 0 0; }
  .capture-quality legend { padding: 0; font-size: 13px; color: var(--text-secondary); }
  .setup-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .setup label { color: var(--text-secondary); font-size: 12px; }
  .path-row { display: flex; gap: 8px; margin-top: 5px; }
  .path-row input { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .status { color: var(--text-secondary); min-height: 21px; }

  /* ---------- combat logging ---------- */

  /* Bigger than the labels above it, because this one is a decision rather than a field. */
  .setup label.check {
    display: flex; align-items: center; gap: 9px; margin: 14px 0 10px;
    font-size: 14px; color: var(--text-primary); cursor: pointer;
  }
  .setup label.check input { width: 15px; height: 15px; cursor: pointer; }
  /* The two states that are not what the reader asked for say so in colour as well as in
     words: on-but-not-advanced writes a log with nothing useful in it, and stale means
     nothing is being written at all. */
  #combat-log-state[data-state="advanced"] { color: var(--ok); }
  #combat-log-state[data-state="basic"],
  #combat-log-state[data-state="stale"] { color: var(--bad); }
  #combat-log-detail { margin-top: 6px; }
  #combat-log-detail div + div { margin-top: 2px; }

  /* ---------- deleting old combat logs ---------- */

  /* A window is two digits, not a path, so it does not take a path's width. */
  #retain-days { width: 5em; }
  #retain-days + .sub { align-self: center; }
  /* Files that are about to be deleted do not get to be drawn in the colour of a success. */
  #log-retention-state[data-state="stale"] { color: var(--bad); }
  /* The two lists a reader is meant to check the sentence against: what would go, and what
     Chronie will never take. Indented so a name reads as evidence rather than as more copy. */
  #log-retention-doomed, #log-retention-unread { margin-top: 8px; padding-left: 10px; }
  #log-retention-detail { margin-top: 8px; }
  #log-retention-doomed div + div,
  #log-retention-unread div + div,
  #log-retention-detail div + div { margin-top: 2px; }

  /* ---------- sync over wifi ---------- */

  .wifi-halves {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;
    margin-top: 12px;
  }
  .wifi-half h3 { margin: 0; font-size: 14px; }
  .wifi-half > .sub { margin-top: 4px; }
  .wifi-peers { display: grid; gap: 6px; margin-top: 12px; }
  .wifi-peer {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
    text-align: left; width: 100%;
  }
  .wifi-peer-address { color: var(--text-muted); font-size: 12px; }
  /* The one screen in the app that destroys data if it is answered without reading, so it
     is drawn as an interruption rather than as another row of settings. */
  .wifi-offer {
    margin-top: 12px; padding: 12px; border-radius: 8px;
    border: 1px solid var(--series-1); background: var(--surface-2);
  }
  .wifi-offer p { margin: 0; }
  .wifi-offer .actions { margin-top: 10px; }

  /* ---------- dialogs ---------- */

  dialog {
    border: 1px solid var(--border); border-radius: 12px; padding: 0;
    background: var(--surface-1); color: var(--text-primary);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }

  #segment-detail { width: min(680px, 94vw); max-height: 86vh; }
  #segment-detail[open] { display: flex; flex-direction: column; }
  .detail-head {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid var(--border); flex: none;
  }
  .detail-title { font-size: 16px; font-weight: 620; margin: 0; letter-spacing: -0.01em; }
  .detail-position { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .detail-nav { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .detail-nav button { padding: 5px 11px; line-height: 1.1; }
  .detail-body { padding: 16px; overflow-y: auto; }
  .detail-who { margin: 0 0 3px; font-size: 15px; }
  .detail-facts { margin: 0 0 12px; color: var(--text-secondary); font-size: 12.5px; }
  .detail-activities { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
  .detail-activities button { font-size: 11px; padding: 2px 8px; }
  .detail-highlights { margin-top: 14px; }
  .detail-highlights .tally-row { margin-top: 0; }
  .detail-section h3 {
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-secondary); margin: 16px 0 5px;
  }
  .detail-section ul { margin: 0; padding-left: 18px; }
  .detail-section li { margin: 3px 0; }
  .detail-section p { margin: 0; }
  .detail-section a { color: var(--series-1); }

  /* An achievement carries more than a line: the game's own sentence for it, what it
     granted, where it sits and what it was worth. So it is a row rather than a bullet. */
  .earned { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .earned-item { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; }
  .earned-item:hover { background: var(--surface-2); }
  /* Drawn before the lookup comes back, and left empty for the achievements this install
     has nothing to show for — so the column of icons never goes ragged. */
  .earned-icon {
    flex: none; width: 32px; height: 32px; border-radius: 6px; margin-top: 1px;
    border: 1px solid var(--border); background: var(--surface-2); overflow: hidden;
  }
  .earned-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .detail-section .earned-what { color: var(--text-secondary); margin: 2px 0 0; }
  .detail-section .earned-reward { color: var(--gold); font-size: 12px; margin: 2px 0 0; }
  .detail-section .earned-facts {
    display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 0;
  }

  /* Where a reputation gain left the character: a bar under the faction, indented past its
     name so the two read as one entry. A real <progress> rather than a pair of divs, so the
     numbers under it are the caption of something a screen reader already announces as a
     progress bar. */
  .detail-section .rep-standing {
    display: flex; align-items: center; gap: 8px;
    margin: 2px 0 0; font-size: 12px; color: var(--text-secondary);
  }
  .rep-bar {
    flex: none; width: 180px; height: 8px;
    appearance: none; border: none; border-radius: 4px;
    background: var(--surface-2); color: var(--ok);
  }
  /* What the rest of the account has already done with the faction, and what it holds of
     the currency. Set below the line it belongs to rather than beside it: this is context
     for the number above, and it must never be mistaken for the number itself. */
  .detail-section .rep-account {
    margin: 2px 0 0 12px; font-size: 12px;
  }
  .account-total { color: var(--text-secondary); font-size: 12px; }

  .rep-bar::-webkit-progress-bar { background: var(--surface-2); border-radius: 4px; }
  .rep-bar::-webkit-progress-value { background: var(--ok); border-radius: 4px; }
  .rep-bar::-moz-progress-bar { background: var(--ok); border-radius: 4px; }

  /* A change to an equipment set is a set and the slots it moved, so it is a list holding
     lists. The slot rows line up in three columns — where, what was there, what is now —
     because scanning down "what replaced what" is the whole reason to open one. */
  .equipsets { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .equipset { padding: 6px 8px; border-radius: 8px; }
  .equipset:hover { background: var(--surface-2); }
  .detail-section .equipset-name { margin: 0; }
  .equipset-slots {
    list-style: none; margin: 4px 0 0; padding: 0 0 0 22px;
    font-size: 12.5px; color: var(--text-secondary);
  }
  .equipset-slots li {
    display: grid; grid-template-columns: 84px 1fr 1fr; gap: 8px; align-items: baseline;
  }
  .equipset-slot { color: var(--text-secondary); }
  /* The arrow is drawn rather than written so a screen reader is not made to say it on
     every row; the two columns already read as before and after. */
  .equipset-now::before { content: "→ "; color: var(--text-secondary); }

  /* ---------- an item, wherever one is named ---------- */

  /* One piece of gear: its picture, its name in the colour the game writes it in, and the
     facts under it. The same three parts wherever an item turns up — a transmog source, a
     slot of an equipment set, an unfolded summary — because it is the same component. */
  .item { display: inline-flex; gap: 7px; align-items: flex-start; vertical-align: top; }
  /* Drawn before the lookup comes back, and left empty for the items this install has no
     picture for, so a column of items never goes ragged. */
  .item-icon {
    flex: none; width: 26px; height: 26px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--surface-2); overflow: hidden;
  }
  /* Icons are stored at 64 pixels and shown at a fraction of that, which bilinear suits. */
  .item-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .item-said { display: grid; gap: 3px; }
  .item-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .detail-section .item-name, .item-name { color: var(--text-primary); font-weight: 550; }
  .item-facts { display: flex; flex-wrap: wrap; gap: 4px; }

  /* A list of items — the transmog a segment collected — is a list of rows rather than of
     bullets, the way the achievements above it are. */
  .detail-section ul.items { list-style: none; padding-left: 0; display: grid; gap: 2px; }
  .detail-section ul.items li { margin: 0; padding: 4px 6px; border-radius: 8px; }
  .detail-section ul.items li:hover { background: var(--surface-2); }
  /* Smaller where the row is already small: a slot of an equipment set has two items side by
     side, and an unfolded summary is a line of twelve-pixel text. */
  .equipset-slots .item-icon, .hl-item .item-icon { width: 18px; height: 18px; border-radius: 4px; }
  .equipset-slots .item, .hl-item .item { gap: 5px; }
  .hl-item .item-name { font-weight: inherit; }

  /* The colours the game writes an item's name in, which are the one thing about a piece of
     gear every player already reads without being told. An item whose lookup has not come
     back carries no quality at all and stays the colour of the text around it — which is why
     this is keyed on the attribute rather than defaulted to poor grey.

     The attribute rather than a `style` prop for the same reason `data-class` is one: the
     packaged app's CSP nonces `style-src`, and every inline style the page writes is
     dropped. */
  [data-quality="0"] { color: #9d9d9d; }
  [data-quality="1"] { color: var(--text-primary); }
  [data-quality="2"] { color: #1eff00; }
  [data-quality="3"] { color: #0070dd; }
  [data-quality="4"] { color: #a335ee; }
  [data-quality="5"] { color: #ff8000; }
  [data-quality="6"] { color: #e6cc80; }
  [data-quality="7"] { color: #00ccff; }
  /* On the frame it is a border rather than ink: a rare item's icon sits in a blue box the
     way it does in the game's own bags. */
  .item-icon[data-quality] { border-color: currentColor; }

  .mog-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .mog-item {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 7px 8px; border-radius: 8px;
  }
  .mog-item:hover { background: var(--surface-2); }
  .mog-item[data-worn="true"] { background: var(--surface-2); }
  .mog-item .badge { flex: none; min-width: 74px; text-align: center; }
  /* The frame is drawn before the picture is decoded, and stays empty for the appearances
     this install has no texture for — so the column of icons never goes ragged. */
  .mog-icon {
    flex: none; width: 32px; height: 32px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-2); overflow: hidden;
  }
  .mog-icon img {
    display: block; width: 100%; height: 100%;
    /* Icons are stored at 64 pixels and shown at half that, which bilinear scaling suits. */
    object-fit: cover;
  }
  /* The same frame, at the size a character in it is worth looking at. A 32-pixel square is a
     bag icon; a body wearing something needs the height, and the rows grow to match rather than
     the picture being squeezed into the icon's place. */
  .mog-worn { width: 84px; height: 112px; border-radius: 8px; }
  .mog-worn canvas { display: block; width: 100%; height: 100%; }
  /* Wider rows and a grid rather than a column: twenty bodies down one side of the panel is a
     great deal of scrolling past a great deal of empty space beside them. */
  #wardrobe-list[data-models="true"] .mog-items {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px;
  }
  #wardrobe-list[data-models="true"] .mog-item { align-items: flex-start; }
  #wardrobe-list[data-models="true"] .mog-pick { align-items: flex-start; }
  /* The whole row is one button — picture, slot and name — because putting the piece on is
     what a reader opened the set to do. Pressed means worn. */
  .mog-pick {
    display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0;
    padding: 2px; margin: 0; border: 0; border-radius: 8px; background: none; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
  }
  .mog-pick[aria-pressed="true"] { outline: 2px solid var(--series-1); outline-offset: 1px; }
  /* A piece the game gives no place on a character. The row keeps its picture and its name —
     the set's own count includes it — and only the toggle is out of reach. */
  .mog-pick:disabled { cursor: default; opacity: 0.55; }
  .mog-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mog-item:hover .mog-pick:not(:disabled) .mog-name {
    text-decoration: underline; text-underline-offset: 3px;
  }
  /* Wowhead, in the corner: the errand a reader is not here for, kept out of the way of the
     one they are. Big enough to hit — the icon is 13px inside a 26px target. */
  .mog-wowhead {
    flex: none; margin-left: auto; display: inline-flex; align-items: center;
    justify-content: center; width: 26px; height: 26px; border-radius: 7px;
    color: var(--text-secondary);
  }
  .mog-wowhead:hover { color: var(--series-1); background: var(--surface-1); }

  /* The sets whose clothes these are. Quiet and under the chips: a reader is looking at one
     set, and this is the footnote saying it is also three others. */
  .mog-alternates {
    list-style: none; margin: 4px 0 0; padding: 0;
    font-size: 12px; color: var(--text-secondary);
  }
  .mog-alternates li { padding: 1px 0 1px 10px; border-left: 2px solid var(--border); }

  /* The one fact a row volunteers. A reader whose class cannot wear the set's own version of a
     look can still have the look, and it is worth a chip on the row rather than a line inside
     a list they have to open first. */
  .chip.mog-lifted { border-color: var(--series-1); color: var(--series-1); }
  /* How many other items give this look. Deliberately quiet — it is a count, and the reader
     came for the picture beside it. */
  .mog-sources-toggle {
    flex: none; padding: 2px 8px; border-radius: 999px; cursor: pointer;
    border: 1px dashed var(--border); background: none;
    font: inherit; font-size: 12px; color: var(--text-secondary);
  }
  .mog-sources-toggle:hover { color: var(--text); border-style: solid; }
  .mog-sources-toggle[aria-expanded="true"] { border-style: solid; color: var(--text); }
  /* The items themselves, indented under the look they give. The whole row wraps, so this
     takes the full width and starts a line of its own. */
  .mog-sources {
    flex: 1 0 100%; list-style: none; margin: 4px 0 0; padding: 0 0 0 42px;
    display: grid; gap: 2px;
  }
  .mog-source {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 3px 6px; border-radius: 6px; font-size: 13px;
    border-left: 2px solid var(--border);
  }
  .mog-source:hover { background: var(--surface-1); }
  .mog-source-name { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; }
  .mog-source .chip { font-size: 11px; }

  .mog-note { text-align: center; margin: 0; }

  /* ---------- what the reader says about the wardrobe ---------- */

  /* The star and the tags, on a set's card and on every row of both browsers. It wraps to a
     line of its own inside a card and sits inline on a row, which is the whole reason it is a
     flex container of its own rather than markup dropped into two different parents. */
  .mark {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0;
  }
  /* Hollow until it is pressed, and then the one colour on the screen that means "mine". The
     glyph is drawn — see `Star` — so this is the whole of what makes it look starred. */
  .mark-star {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0; border-radius: 7px;
    border: 1px solid transparent; background: none; cursor: pointer;
    color: var(--text-secondary);
  }
  .mark-star:hover { color: var(--series-1); background: var(--surface-1); }
  .mark-star[aria-pressed="true"] { color: var(--series-1); }
  /* A tag reads as one thing with a way to remove it, so the × sits inside the chip rather
     than beside it — a chip and a loose button would be two things to aim at. */
  .chip.mark-tag {
    display: inline-flex; align-items: center; gap: 4px; padding-right: 3px;
    max-width: 100%; overflow: hidden;
  }
  .mark-tag-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mark-drop {
    flex: none; padding: 0 3px; border: 0; border-radius: 4px; background: none;
    font: inherit; line-height: 1; color: var(--text-secondary); cursor: pointer;
  }
  .mark-drop:hover { color: var(--text); background: var(--surface-1); }
  /* Quiet, and dashed the way the count of other items is: it is an invitation rather than
     a thing the reader came to the row for. */
  .mark-open {
    flex: none; padding: 1px 7px; border-radius: 999px; cursor: pointer;
    border: 1px dashed var(--border); background: none;
    font: inherit; font-size: 11px; color: var(--text-secondary);
  }
  .mark-open:hover { color: var(--text); border-style: solid; }
  .mark-open[aria-expanded="true"] { border-style: solid; color: var(--text); }
  /* The form takes the width it is in, so a row's two boxes never squeeze the name beside
     them into an ellipsis. */
  .mark-form { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .mark-form input {
    min-width: 0; padding: 3px 7px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-2); color: var(--text); font-family: inherit;
  }
  .mark-key { flex: 1 1 110px; }
  .mark-value { flex: 2 1 150px; }
  .mark-save {
    flex: none; padding: 3px 10px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-2); color: var(--text); font-family: inherit;
  }
  .mark-save:hover { border-color: var(--series-1); }
  /* A refusal from the backend — a key that is nothing, a value longer than a chip can hold.
     Full width, because it is a sentence and not a chip. */
  .mark-failure { flex: 1 0 100%; font-size: 12px; color: var(--bad); }

  /* ---------- screenshots ---------- */

  /* A grid that fills whatever it is dropped into — a session card is wider than the detail
     modal, and neither should decide how many tiles fit in the other. */
  .capture-grid {
    list-style: none; margin: 8px 0 0; padding: 0;
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  }
  .capture-tile {
    display: block; width: 100%; padding: 0; overflow: hidden;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1);
    cursor: pointer; text-align: left;
  }
  .capture-tile:hover { border-color: var(--series-1); background: var(--surface-1); }
  /* A fixed frame whatever is in it, so a grid of pictures of different shapes — and of tiles
     with no picture at all — stays a grid rather than a ragged staircase. */
  .capture-thumb {
    display: grid; place-items: center; aspect-ratio: 16 / 10;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  .capture-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* A picture that could not be found reads as a gap; a note never asked for one, so it keeps
     the ordinary tile background rather than looking like the same failure. */
  .capture-thumb[data-state="missing"] { background: var(--surface-0); }
  .capture-placeholder { font-size: 20px; opacity: .55; }
  .capture-caption { display: grid; gap: 1px; padding: 6px 8px; }
  .capture-when { font-size: 12px; font-variant-numeric: tabular-nums; }
  /* One line of it, because the note is free text and a tile is not where it is read in
     full — the viewer behind the tile is. */
  .capture-note, .capture-where {
    font-size: 11.5px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #capture-viewer { width: min(900px, 94vw); max-height: 92vh; }
  #capture-viewer[open] { display: flex; flex-direction: column; }
  /* The picture is the point of this dialog, so it takes the room and the controls take what
     is left. Contained rather than cropped: a screenshot shown at the wrong aspect ratio is
     not the screenshot. */
  .capture-full {
    display: grid; place-items: center; min-height: 220px;
    background: var(--surface-0); border-radius: 10px; padding: 6px;
  }
  .capture-full img { display: block; max-width: 100%; max-height: 60vh; object-fit: contain; }
  .capture-full p { margin: 0; text-align: center; }
  .capture-note-edit { display: grid; gap: 5px; margin-top: 10px; }
  .capture-note-edit label { font-size: 12px; color: var(--text-secondary); }
  .capture-note-edit textarea {
    width: 100%; resize: vertical; font: inherit; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-1); color: var(--text-primary);
  }
  .capture-note-edit .dialog-actions { margin-top: 8px; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.danger:hover { background: var(--bad); color: white; }
  /* Said before anything is deleted, and in the colour of the thing about to happen. */
  .capture-warning { margin: 6px 0 0; font-size: 12.5px; color: var(--bad); }
  .capture-status { margin: 6px 0 0; font-size: 12.5px; color: var(--text-secondary); }

  #activity-editor { width: min(560px, 92vw); }
  .dialog-body { padding: 18px; }
  .dialog-body h2 { font-size: 15px; margin: 0 0 2px; }
  .dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .dialog-actions .spacer { margin-left: auto; }
  .editor-list { display: grid; gap: 10px; margin-top: 14px; }
  .editor-row { border: 1px solid var(--border); border-radius: 9px; padding: 12px; }
  .editor-row .row-head { display: flex; gap: 8px; align-items: center; }
  .editor-row .row-head select, .editor-row .row-head input { flex: 1; min-width: 0; }
  .editor-fields {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .editor-fields .field { display: grid; gap: 3px; }
  .editor-fields label { font-size: 12px; color: var(--text-secondary); }

  /* ---------- tooltip ---------- */

  #tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
    padding: 8px 10px; font-size: 12px; z-index: 20; max-width: 280px;
  }
  #tooltip b { display: block; margin-bottom: 2px; }
  #tooltip .tip-places { display: block; margin-top: 3px; color: var(--text-muted); }
</style>
</head>
<body>
<!-- The window is drawn by React from here down; `src/app.tsx` is the shape of it. The
     stylesheet stays above, in the page, because the packaged app is served under a CSP with
     a nonce in `style-src` and a `<style>` tag Tauri embeds is the one thing it stamps. -->
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
