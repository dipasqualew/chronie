<title>Chronie</title>

<body>
<!-- The window is drawn by React from here down; `src/app.tsx` is the shape of it, and every
     rule it is drawn with arrives with the component that owns it — `src/base.css` first,
     through `main.tsx`, and one sheet per component after that.

     Nothing is styled from this file. It used to carry the whole stylesheet, on the grounds
     that a style tag is what Tauri stamps its `style-src` nonce onto; but the built page
     reaches its CSS through a `<link>` that `'self'` already allows, and the dev server hands
     Vite the same nonce through the `csp-nonce` meta tag it looks for — see `vite.config.ts`.
     What the single sheet did carry was every branch at once: two unrelated features landing
     nine lines apart in it was the measurement that closed issue #155. -->
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
