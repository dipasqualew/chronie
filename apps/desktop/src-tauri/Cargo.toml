[package]
name = "chronie-desktop"
version = "0.1.0"
description = "Background segment collector and addon manager for chronie"
authors = ["chronie"]
edition = "2021"

[lib]
name = "chronie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The app's binary, named, because the bundler reads this list to decide which one the
# shipped app launches. Left undeclared it goes looking in `src/bin/` instead — where
# `src/main.rs` has never been, since Cargo builds that one without being told — and
# promotes whatever single candidate it finds to the app's main executable. That is how a
# bindings exporter parked in `src/bin/` became the program a player launched, installing
# and opening and dying in the same instant. The exporter is a test now, so there is nothing
# left to confuse the bundler with — and naming this one keeps its answer from depending on
# what else happens to be lying around later.
[[bin]]
name = "chronie-desktop"
path = "src/main.rs"

# A debug build of this crate is fine; a debug build of a codec is not. The tests decode
# BLPs, resize textures, re-encode PNGs and JPEGs and hash what comes out, and at
# `opt-level = 0` those inner loops run several times slower than the code actually under
# test — `captures` and `character` were 18 of a 23 second run and almost none of it was
# Chronie's own code.
#
# Named crates rather than `"*"`. There are 635 packages in the lockfile and eleven of them
# do this work; optimising the whole tree to reach those eleven turns every cache miss into
# a much longer cold build of tauri, webkit bindings and reqwest, which no test ever runs in
# a loop. Keep this list to crates that appear in a profile of the suite.
[profile.dev.package]
adler2 = { opt-level = 2 }
crc32fast = { opt-level = 2 }
flate2 = { opt-level = 2 }
image = { opt-level = 2 }
miniz_oxide = { opt-level = 2 }
png = { opt-level = 2 }
sha2 = { opt-level = 2 }
wow-blp = { opt-level = 2 }
zune-core = { opt-level = 2 }
zune-jpeg = { opt-level = 2 }

# Full debug info for every dependency is a slower link and a much larger `target/` for the
# CI cache to carry around. Line tables keep the file and line in a panic backtrace, which
# is the part a failing test actually needs.
[profile.dev]
debug = "line-tables-only"

[build-dependencies]
# The same version `tauri-winres` already builds, so this costs no extra compilation. It is
# here because `tauri-build` equips only `[[bin]]` targets with the Windows manifest — see
# `embed_windows_manifest_for_tests` in build.rs.
embed-resource = "3.0"
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.38", features = ["serde"] }
flate2 = "1.1.9"
gltf-json = "1.4.1"
hex = "0.4.3"
# The formats this app has to read, and no others. `png` is what an icon is re-encoded as;
# `jpeg` and `tga` are what the client writes a screenshot as, which is the player's own choice
# of `screenshotFormat` and not something Chronie gets to assume either way. Default features
# would pull in a dozen decoders nothing here will ever be handed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
# `hooks` is not a hook in the ordinary sense here: it is what carries `progress_handler`,
# which is the only way to put a clock on a query somebody typed themselves. It pulls in no
# dependencies of its own — the feature exists to keep the C callbacks out of builds that
# never register one.
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
sha2 = "0.10.8"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri = { version = "2.1.1", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.0.1"
tempfile = "3.12.0"
# Spans, and nothing that collects them. `tracing`'s macros compile to a check against a
# global that no subscriber has set, so the shipped app carries the instrumentation at
# roughly the cost of the branch — and `examples/trace_render` is where a subscriber gets
# installed and the OpenTelemetry stack gets pulled in.
tracing = "0.1.44"
wow-blp = "0.3.2"

[dev-dependencies]
# The collecting half, which only the tracing example builds. Kept out of `[dependencies]`
# deliberately: OTLP drags in an HTTP client and a protobuf codec, and a segment collector
# that ships those to draw a character would be paying for a measurement nobody took.
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
tempfile = "3.12.0"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
