[package]
name = "chronie-desktop"
version = "0.1.0"
description = "Background segment collector and addon manager for chronie"
authors = ["chronie"]
edition = "2021"

[lib]
name = "chronie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.38", features = ["serde"] }
flate2 = "1.1.9"
gltf-json = "1.4.1"
hex = "0.4.3"
# The formats this app has to read, and no others. `png` is what an icon is re-encoded as;
# `jpeg` and `tga` are what the client writes a screenshot as, which is the player's own choice
# of `screenshotFormat` and not something Chronie gets to assume either way. Default features
# would pull in a dozen decoders nothing here will ever be handed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
# `hooks` is not a hook in the ordinary sense here: it is what carries `progress_handler`,
# which is the only way to put a clock on a query somebody typed themselves. It pulls in no
# dependencies of its own — the feature exists to keep the C callbacks out of builds that
# never register one.
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
sha2 = "0.10.8"
tauri = { version = "2.1.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.0.1"
tempfile = "3.12.0"
# Spans, and nothing that collects them. `tracing`'s macros compile to a check against a
# global that no subscriber has set, so the shipped app carries the instrumentation at
# roughly the cost of the branch — and `examples/trace_render` is where a subscriber gets
# installed and the OpenTelemetry stack gets pulled in.
tracing = "0.1.44"
wow-blp = "0.3.2"

[dev-dependencies]
# The collecting half, which only the tracing example builds. Kept out of `[dependencies]`
# deliberately: OTLP drags in an HTTP client and a protobuf codec, and a segment collector
# that ships those to draw a character would be paying for a measurement nobody took.
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
tempfile = "3.12.0"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
