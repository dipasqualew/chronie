<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wdp-wow — sessions</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f6f5f2;
    --surface-1: #fcfcfb;
    --surface-2: #efeeea;
    --border: #dedcd5;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #85837c;
    --series-1: #2a78d6;
    --series-1-soft: #cde2fb;
    --grid: #e6e4dd;
    --gold: #a67c00;
    --shadow: 0 1px 2px rgba(11, 11, 11, .06), 0 8px 24px rgba(11, 11, 11, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --border: #34342f;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8d8c83;
      --series-1: #3987e5;
      --series-1-soft: #184f95;
      --grid: #2a2a27;
      --gold: #e0b64a;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --border: #34342f;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8d8c83;
    --series-1: #3987e5;
    --series-1-soft: #184f95;
    --grid: #2a2a27;
    --gold: #e0b64a;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); font-size: 13px; }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { padding: 14px 16px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .tile .value { font-size: 26px; font-weight: 620; margin-top: 6px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .foot { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  section.chart { padding: 16px 16px 8px; margin-bottom: 16px; }
  .chart h2, .table-head h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .chart .sub, .table-head .sub { margin-bottom: 12px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-text { fill: var(--text-muted); font-size: 11px; }
  .bar { fill: var(--series-1); }
  .bar-hit { fill: transparent; cursor: default; }
  .bar-group:hover .bar { fill: var(--text-primary); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  input, select {
    font: inherit;
    color: var(--text-primary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 9px;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .count { color: var(--text-muted); font-size: 12px; margin-left: auto; }

  .table-head { padding: 16px 16px 0; }
  .scroller { overflow-x: auto; padding: 0 4px 4px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th {
    position: sticky; top: 0; z-index: 1;
    background: var(--surface-1);
    color: var(--text-secondary);
    font-size: 12px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text-primary); }
  th .arrow { color: var(--series-1); font-size: 10px; }
  tbody tr:hover { background: var(--surface-2); }
  td.num { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: baseline; }
  .muted { color: var(--text-muted); }
  .gold { color: var(--gold); font-weight: 550; }
  .loss { color: #c65a5a; font-weight: 550; }
  .appearance-new { color: #59d973; }
  .appearance-variant { color: #b373ff; }
  .empty { padding: 40px 16px; text-align: center; color: var(--text-muted); }

  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-2);
    vertical-align: baseline;
  }
  .chip {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: var(--surface-2); color: var(--text-secondary); margin: 0 4px 4px 0;
  }
  .chip.achv { background: var(--series-1-soft); color: var(--text-primary); }

  .timeline { padding: 4px 16px 8px; }
  .tl-day { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .06em; }
  .tl-row {
    display: grid; grid-template-columns: 56px 1fr; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .tl-row:last-child { border-bottom: none; }
  .tl-time { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .tl-body .tl-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .tl-where { font-weight: 550; }
  .tl-stats { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
  .tl-extras { margin-top: 5px; }

  #tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    transition: opacity .1s;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
    padding: 8px 10px; font-size: 12px; z-index: 10;
    max-width: 260px;
  }
  #tooltip b { display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sessions</h1>
    <div class="sub" id="meta"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="panel chart">
    <h2>Loot value per day</h2>
    <div class="sub">Vendor value of items added to inventory, by the day the session ended.</div>
    <svg id="chart" viewBox="0 0 900 220" role="img" aria-label="Loot value per day"></svg>
  </section>

  <section class="panel timeline-panel">
    <div class="table-head">
      <h2>Timeline</h2>
      <div class="sub">Every session as it happened, newest first, across characters.</div>
    </div>
    <div id="timeline" class="timeline"></div>
  </section>

  <section class="panel">
    <div class="table-head">
      <h2>Every session</h2>
      <div class="sub">Click a column to sort.</div>
      <div class="controls">
        <input id="search" type="search" placeholder="Filter location or character…" aria-label="Filter sessions">
        <select id="character" aria-label="Character"></select>
        <select id="day" aria-label="Day"></select>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div class="scroller"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="empty" id="empty" hidden></div>
  </section>
</div>

<div id="tooltip" role="status"></div>

<script>
const PAYLOAD = /*__WDP_DATA__*/null || { generatedAt: null, retainDays: 7, sessions: [] };
const SESSIONS = PAYLOAD.sessions || [];

// The client's own class colours, so a character reads the same here as in game.
const CLASS_COLORS = {
  DEATHKNIGHT: "#c41e3a", DEMONHUNTER: "#a330c9", DRUID: "#ff7c0a", EVOKER: "#33937f",
  HUNTER: "#aad372", MAGE: "#3fc7eb", MONK: "#00ff98", PALADIN: "#f48cba",
  PRIEST: "#ffffff", ROGUE: "#fff468", SHAMAN: "#0070dd", WARLOCK: "#8788ee",
  WARRIOR: "#c69b6d",
};

const $ = (id) => document.getElementById(id);

function gold(copper) {
  const total = Math.max(Math.round(copper || 0), 0);
  const g = Math.floor(total / 10000), s = Math.floor((total % 10000) / 100), c = total % 100;
  if (g > 0) return `${g.toLocaleString()}g ${s}s`;
  if (s > 0) return `${s}s ${c}c`;
  return `${c}c`;
}

// A net difference keeps its sign, so a session that ended down on gold reads as a loss.
function signedGold(copper) {
  const value = Math.round(copper || 0);
  if (value < 0) return `-${gold(-value)}`;
  return gold(value);
}

// "none" for open world, else "instance"; used as a small badge on each session.
const isInstance = (session) => !!session.instanceType && session.instanceType !== "none";
const locationType = (session) => (isInstance(session) ? "instance" : "world");

function duration(seconds) {
  const total = Math.max(Math.round(seconds || 0), 0);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60);
  if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
  return `${m}:${String(total % 60).padStart(2, "0")}`;
}

const clock = (epoch) =>
  new Date(epoch * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

const signed = (amount) => `${amount >= 0 ? "+" : ""}${amount.toLocaleString()}`;
const repText = (gains) =>
  (gains || []).map((gain) => `${gain.faction} +${gain.amount.toLocaleString()}`).join(", ");
const currencyText = (gains) =>
  (gains || []).map((gain) => `${gain.name} ${signed(gain.amount)}`).join(", ");
const achievementScope = (event) =>
  event.accountFirst ? "account first" : "character first";
const achievementText = (earned) =>
  (earned || []).map((event) => `${event.name} (${achievementScope(event)})`).join(", ");
const transmogScope = (event) => {
  if (event.newAppearance === true) return '<span class="appearance-new">new</span>';
  if (event.newAppearance === false) return '<span class="appearance-variant">variant</span>';
  return '<span class="muted">unknown</span>';
};
const transmogLink = (event) =>
  `<a href="https://www.wowhead.com/item=${encodeURIComponent(event.id)}" target="_blank" rel="noopener noreferrer">Item ${escapeHtml(event.id)}</a>` +
  ` (${transmogScope(event)})`;
const transmogCell = (events) =>
  (events || []).length ? events.map(transmogLink).join(", ") : '<span class="muted">—</span>';

// A compact cell that names the first couple of entries and counts the rest, with the
// full list in the title attribute so nothing is lost to the abbreviation.
function listCell(entries, asText) {
  const list = entries || [];
  if (list.length === 0) return '<span class="muted">—</span>';
  const shown = asText(list.slice(0, 2));
  const rest = list.length > 2 ? ` <span class="muted">+${list.length - 2} more</span>` : "";
  return `<span title="${escapeHtml(asText(list))}">${escapeHtml(shown)}</span>${rest}`;
}

const repCell = (gains) => listCell(gains, repText);
const currencyCell = (gains) => listCell(gains, currencyText);
const achievementCell = (earned) => listCell(earned, achievementText);
const levelUpText = (events) => (events || []).map((event) => `Level ${event.level}`).join(", ");
const levelUpCell = (events) => listCell(events, levelUpText);
const questLink = (event) =>
  `<a href="https://www.wowhead.com/quest=${encodeURIComponent(event.id)}" target="_blank" rel="noopener noreferrer">📜 Quest ${escapeHtml(event.id)}</a>`;
const questCell = (events) =>
  (events || []).length ? events.map(questLink).join(", ") : '<span class="muted">—</span>';
const collectionText = (events) => (events || []).map((event) => event.name).join(", ");
const collectionCell = (events) => listCell(events, collectionText);
const housingScope = (event) => (event.warbandFirst ? "warband first" : "additional");
const housingText = (events) =>
  (events || []).map((event) => `${event.name} (${housingScope(event)})`).join(", ");
const housingCell = (events) => listCell(events, housingText);

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"]/g, (char) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
}

/* ---------- header + tiles ---------- */

const totals = SESSIONS.reduce((acc, session) => {
  acc.lootValue += session.lootValue || 0;
  acc.goldDiff += session.goldDiff || 0;
  acc.seconds += session.seconds || 0;
  acc.transmogs += (session.transmogs || []).length;
  acc.appearances += (session.transmogs || []).filter((event) => event.newAppearance).length;
  acc.variants += (session.transmogs || []).filter((event) => event.newAppearance === false).length;
  acc.achievements += (session.achievements || []).length;
  acc.levelUps += (session.levelUps || []).length;
  acc.mounts += (session.mounts || []).length;
  acc.pets += (session.pets || []).length;
  acc.quests += (session.quests || []).length;
  acc.toys += (session.toys || []).length;
  acc.housingItems += (session.housingItems || []).length;
  acc.housingWarband += (session.housingItems || []).filter((event) => event.warbandFirst).length;
  acc.housingXP += session.housingXP || 0;
  acc.housingLevelUps += (session.housingLevelUps || []).length;
  (session.reputation || []).forEach((gain) => {
    acc.reputation[gain.faction] = (acc.reputation[gain.faction] || 0) + gain.amount;
  });
  (session.currencies || []).forEach((gain) => {
    acc.currencies[gain.name] = (acc.currencies[gain.name] || 0) + gain.amount;
  });
  return acc;
}, {
  lootValue: 0, goldDiff: 0, seconds: 0, transmogs: 0, appearances: 0, variants: 0,
  achievements: 0, levelUps: 0, mounts: 0, pets: 0, quests: 0, toys: 0,
  housingItems: 0, housingWarband: 0, housingXP: 0, housingLevelUps: 0,
  reputation: {}, currencies: {},
});

const topFaction = Object.entries(totals.reputation).sort((a, b) => b[1] - a[1])[0];
const topCurrency = Object.entries(totals.currencies).sort((a, b) => b[1] - a[1])[0];
const completedTotals = {
  Achievements: totals.achievements,
  "Level ups": totals.levelUps,
  Currency: Object.keys(totals.currencies).length,
  Mounts: totals.mounts,
  "New transmog": totals.transmogs,
  Pets: totals.pets,
  Quests: totals.quests,
  Reputation: Object.keys(totals.reputation).length,
  Toys: totals.toys,
  "Housing items": totals.housingItems,
  "Housing XP": totals.housingXP,
  "Housing levels": totals.housingLevelUps,
};

$("meta").textContent = SESSIONS.length
  ? `${SESSIONS.length} sessions over the last ${PAYLOAD.retainDays} days` +
    (PAYLOAD.generatedAt ? ` · collected ${new Date(PAYLOAD.generatedAt).toLocaleString()}` : "")
  : "Nothing collected yet — play for a bit, then log out or /reload so the game writes its saved variables.";

$("tiles").innerHTML = [
  { label: "Sessions", value: SESSIONS.length, foot: `${new Set(SESSIONS.map((s) => s.character)).size} characters` },
  { label: "Loot value", value: gold(totals.lootValue), foot: "items entering inventory" },
  { label: "Net gold", value: signedGold(totals.goldDiff), foot: "wallet change", cls: totals.goldDiff < 0 ? "loss" : "gold" },
  { label: "Time played", value: duration(totals.seconds), foot: "across every session" },
  {
    label: "New transmog",
    value: totals.appearances,
    foot: `${totals.variants} variants` +
      (totals.transmogs > totals.appearances + totals.variants
        ? ` · ${totals.transmogs - totals.appearances - totals.variants} legacy unknown`
        : ""),
  },
  {
    label: "Currency",
    value: topCurrency ? signed(topCurrency[1]) : "0",
    foot: topCurrency ? topCurrency[0] : "none earned",
  },
  {
    label: "Reputation",
    value: topFaction ? topFaction[1].toLocaleString() : "0",
    foot: topFaction ? topFaction[0] : "none earned",
  },
  { label: "Achievements", value: totals.achievements, foot: "earned this window" },
  { label: "Level ups", value: totals.levelUps, foot: "gained this window" },
  { label: "Mounts", value: totals.mounts, foot: "collected this window" },
  { label: "Pets", value: totals.pets, foot: "collected this window" },
  { label: "Quests", value: totals.quests, foot: "completed this window" },
  { label: "Toys", value: totals.toys, foot: "collected this window" },
  {
    label: "Housing items",
    value: totals.housingItems,
    foot: `${totals.housingWarband} warband first · ${totals.housingItems - totals.housingWarband} extra`,
  },
  { label: "Housing XP", value: totals.housingXP.toLocaleString(), foot: "gained this window" },
  { label: "Housing levels", value: totals.housingLevelUps, foot: "gained this window" },
].filter((tile) => !(tile.label in completedTotals) || completedTotals[tile.label] > 0).map((tile) => `<div class="panel tile">
    <div class="label">${escapeHtml(tile.label)}</div>
    <div class="value${tile.cls ? " " + tile.cls : ""}">${escapeHtml(tile.value)}</div>
    <div class="foot">${escapeHtml(tile.foot)}</div>
  </div>`).join("");

/* ---------- gold per day ---------- */

const tooltip = $("tooltip");

function showTooltip(event, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = "1";
  const box = tooltip.getBoundingClientRect();
  const x = Math.min(event.clientX + 14, window.innerWidth - box.width - 8);
  tooltip.style.left = `${x}px`;
  tooltip.style.top = `${Math.max(event.clientY - box.height - 12, 8)}px`;
}

const hideTooltip = () => { tooltip.style.opacity = "0"; };

function drawChart() {
  const svg = $("chart");
  const byDay = new Map();
  SESSIONS.forEach((session) => {
    const bucket = byDay.get(session.day) || { gold: 0, runs: 0 };
    bucket.gold += session.lootValue || 0;
    bucket.runs += 1;
    byDay.set(session.day, bucket);
  });

  // Every day in the window, so a blank day reads as a gap rather than vanishing.
  const days = [];
  const last = SESSIONS.length ? new Date(`${[...byDay.keys()].sort().pop()}T00:00:00`) : new Date();
  for (let back = PAYLOAD.retainDays - 1; back >= 0; back -= 1) {
    const date = new Date(last);
    date.setDate(date.getDate() - back);
    const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    days.push({ key, date, ...(byDay.get(key) || { gold: 0, runs: 0 }) });
  }

  const W = 900, H = 220, PAD_L = 58, PAD_R = 8, PAD_T = 12, PAD_B = 28;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
  // Rounded up to a whole number of gold, so the axis reads 0 / 50g / 100g rather
  // than whatever copper the best day happened to land on.
  const busiest = Math.max(...days.map((day) => day.gold), 1) / 10000;
  const magnitude = 10 ** Math.floor(Math.log10(Math.max(busiest, 1)));
  const peak = Math.ceil(busiest / magnitude) * magnitude * 10000;
  const ticks = [0, peak / 2, peak];
  const step = plotW / days.length;
  const barW = Math.min(step - 10, 64);

  const parts = ticks.map((tick) => {
    const y = PAD_T + plotH - (tick / peak) * plotH;
    return `<line class="grid-line" x1="${PAD_L}" x2="${W - PAD_R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"></line>
      <text class="axis-text" x="${PAD_L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end">${Math.round(tick / 10000).toLocaleString()}g</text>`;
  });

  days.forEach((day, index) => {
    const x = PAD_L + index * step + (step - barW) / 2;
    const height = (day.gold / peak) * plotH;
    const y = PAD_T + plotH - height;
    const label = day.date.toLocaleDateString([], { weekday: "short", day: "numeric" });
    parts.push(`<g class="bar-group" data-day="${escapeHtml(day.key)}" data-runs="${day.runs}" data-gold="${day.gold}">
      ${height > 0.5 ? `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(height, 2).toFixed(1)}" rx="4"></rect>` : ""}
      <rect class="bar-hit" x="${(PAD_L + index * step).toFixed(1)}" y="${PAD_T}" width="${step.toFixed(1)}" height="${plotH}"></rect>
      <text class="axis-text" x="${(x + barW / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${escapeHtml(label)}</text>
    </g>`);
  });

  svg.innerHTML = parts.join("");

  svg.querySelectorAll(".bar-group").forEach((group) => {
    const move = (event) => showTooltip(event,
      `<b>${escapeHtml(group.dataset.day)}</b>${escapeHtml(gold(Number(group.dataset.gold)))} · ${group.dataset.runs} session(s)`);
    group.addEventListener("mousemove", move);
    group.addEventListener("mouseleave", hideTooltip);
  });
}

drawChart();

/* ---------- the timeline ---------- */

// Sessions arrive newest first from the collector; the timeline groups them by day and
// lays each one out as a moment — who, where, and what it yielded — across characters.
function drawTimeline() {
  const host = $("timeline");
  if (SESSIONS.length === 0) {
    host.innerHTML = '<div class="empty">No sessions collected yet.</div>';
    return;
  }

  const byDay = new Map();
  const order = [];
  SESSIONS.forEach((session) => {
    if (!byDay.has(session.day)) {
      byDay.set(session.day, []);
      order.push(session.day);
    }
    byDay.get(session.day).push(session);
  });

  const chips = (session) => {
    const parts = [];
    if ((session.currencies || []).length) parts.push(`<span class="chip">${escapeHtml(currencyText(session.currencies))}</span>`);
    (session.achievements || []).forEach((event) => {
      parts.push(`<span class="chip achv">🏆 ${escapeHtml(event.name)} · ${escapeHtml(achievementScope(event))}</span>`);
    });
    (session.levelUps || []).forEach((event) => {
      parts.push(`<span class="chip">⬆️ Level ${escapeHtml(event.level)}</span>`);
    });
    ["mounts", "pets", "toys"].forEach((key) => {
      (session[key] || []).forEach((event) => {
        parts.push(`<span class="chip">${escapeHtml(event.name)}</span>`);
      });
    });
    (session.transmogs || []).forEach((event) => {
      parts.push(`<span class="chip">${transmogLink(event)}</span>`);
    });
    (session.quests || []).forEach((event) => {
      parts.push(`<span class="chip">${questLink(event)}</span>`);
    });
    (session.housingItems || []).forEach((event) => {
      parts.push(`<span class="chip">🏠 ${escapeHtml(event.name)} · ${escapeHtml(housingScope(event))}</span>`);
    });
    (session.housingLevelUps || []).forEach((event) => {
      parts.push(`<span class="chip">⬆️ Housing Level ${escapeHtml(event.level)}</span>`);
    });
    return parts.length ? `<div class="tl-extras">${parts.join("")}</div>` : "";
  };

  const stats = (session) => {
    const bits = [`Loot value ${gold(session.lootValue)}`];
    if (session.goldDiff) bits.push(`Gold ${signedGold(session.goldDiff)}`);
    if ((session.transmogs || []).length) bits.push(`Transmog ${session.transmogs.length}`);
    if ((session.levelUps || []).length) bits.push(`Level ups ${session.levelUps.length}`);
    if ((session.mounts || []).length) bits.push(`Mounts ${session.mounts.length}`);
    if ((session.pets || []).length) bits.push(`Pets ${session.pets.length}`);
    if ((session.toys || []).length) bits.push(`Toys ${session.toys.length}`);
    if ((session.housingItems || []).length) bits.push(`Housing items ${session.housingItems.length}`);
    if (session.housingXP) bits.push(`Housing XP ${signed(session.housingXP)}`);
    if ((session.housingLevelUps || []).length) bits.push(`Housing levels ${session.housingLevelUps.length}`);
    if ((session.reputation || []).length) bits.push(`Rep ${repText(session.reputation)}`);
    return bits.map(escapeHtml).join(" · ");
  };

  host.innerHTML = order.map((day) => {
    const rows = byDay.get(day).map((session) => {
      const dot = `<span class="dot" style="background:${CLASS_COLORS[session.classFile] || "var(--text-muted)"}"></span>`;
      return `<div class="tl-row">
        <div class="tl-time" title="Session start and end">${escapeHtml(clock(session.startedAt))}<br>– ${escapeHtml(clock(session.endedAt))}</div>
        <div class="tl-body">
          <div class="tl-head">
            <span>${dot}${escapeHtml(session.character)}${session.level == null ? "" : ` <span class="muted">Level ${escapeHtml(session.level)}</span>`}</span>
            <span class="tl-where">${escapeHtml(session.instance)}</span>
            <span class="badge">${escapeHtml(locationType(session))}</span>
            ${session.difficulty ? `<span class="muted">${escapeHtml(session.difficulty)}</span>` : ""}
            <span class="muted">${escapeHtml(duration(session.seconds))}</span>
          </div>
          <div class="tl-stats">${stats(session)}</div>
          ${chips(session)}
        </div>
      </div>`;
    }).join("");
    return `<div class="tl-day">${escapeHtml(day)}</div>${rows}`;
  }).join("");
}

drawTimeline();

/* ---------- the table ---------- */

const COLUMNS = [
  {
    key: "day", title: "Started – ended",
    cell: (s) => `${escapeHtml(s.day)} <span class="muted">${escapeHtml(clock(s.startedAt))} – ${escapeHtml(clock(s.endedAt))}</span>`,
    sort: (s) => s.endedAt,
  },
  {
    key: "character", title: "Character", sort: (s) => s.character,
    cell: (s) => `<span class="dot" style="background:${CLASS_COLORS[s.classFile] || "var(--text-muted)"}"></span>${escapeHtml(s.character)}` +
      (s.level == null ? "" : ` <span class="muted">Level ${escapeHtml(s.level)}</span>`),
  },
  { key: "instance", title: "Location", cell: (s) => escapeHtml(s.instance), sort: (s) => s.instance },
  { key: "type", title: "Type", cell: (s) => `<span class="badge">${escapeHtml(locationType(s))}</span>`, sort: (s) => locationType(s) },
  { key: "difficulty", title: "Difficulty", cell: (s) => escapeHtml(s.difficulty) || '<span class="muted">—</span>', sort: (s) => s.difficulty },
  { key: "seconds", title: "Time", num: true, cell: (s) => duration(s.seconds), sort: (s) => s.seconds },
  { key: "lootValue", title: "Loot value", num: true, cell: (s) => `<span class="gold">${escapeHtml(gold(s.lootValue))}</span>`, sort: (s) => s.lootValue },
  { key: "goldDiff", title: "Gold Δ", num: true, cell: (s) => `<span class="${s.goldDiff < 0 ? "loss" : "gold"}">${escapeHtml(signedGold(s.goldDiff))}</span>`, sort: (s) => s.goldDiff },
  { key: "achievements", title: "Achievements", cell: (s) => achievementCell(s.achievements), sort: (s) => (s.achievements || []).length },
  { key: "levelUps", title: "Level ups", cell: (s) => levelUpCell(s.levelUps), sort: (s) => (s.levelUps || []).length },
  { key: "currencies", title: "Currency", cell: (s) => currencyCell(s.currencies), sort: (s) => (s.currencies || []).reduce((total, gain) => total + gain.amount, 0) },
  { key: "mounts", title: "Mounts", cell: (s) => collectionCell(s.mounts), sort: (s) => (s.mounts || []).length },
  { key: "pets", title: "Pets", cell: (s) => collectionCell(s.pets), sort: (s) => (s.pets || []).length },
  { key: "quests", title: "Quests", cell: (s) => questCell(s.quests), sort: (s) => (s.quests || []).length },
  { key: "reputation", title: "Reputation", cell: (s) => repCell(s.reputation), sort: (s) => (s.reputation || []).reduce((total, gain) => total + gain.amount, 0) },
  { key: "toys", title: "Toys", cell: (s) => collectionCell(s.toys), sort: (s) => (s.toys || []).length },
  { key: "transmogs", title: "Transmog", cell: (s) => transmogCell(s.transmogs), sort: (s) => (s.transmogs || []).length },
  { key: "housingItems", title: "Housing items", cell: (s) => housingCell(s.housingItems), sort: (s) => (s.housingItems || []).length },
  { key: "housingXP", title: "Housing XP", num: true, cell: (s) => (s.housingXP ? signed(s.housingXP) : '<span class="muted">—</span>'), sort: (s) => s.housingXP || 0 },
  { key: "housingLevelUps", title: "Housing levels", cell: (s) => levelUpCell(s.housingLevelUps), sort: (s) => (s.housingLevelUps || []).length },
].filter((column) => {
  if (column.key === "housingXP") return SESSIONS.some((session) => (session.housingXP || 0) !== 0);
  const optional = ["achievements", "levelUps", "currencies", "mounts", "pets", "quests",
    "reputation", "toys", "transmogs", "housingItems", "housingLevelUps"];
  return !optional.includes(column.key) || SESSIONS.some((session) => (session[column.key] || []).length);
});

let sortKey = "day";
let ascending = false;

function options(select, values, allLabel) {
  select.innerHTML = [`<option value="">${allLabel}</option>`]
    .concat(values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)).join("");
}

options($("character"), [...new Set(SESSIONS.map((s) => s.character))].sort(), "All characters");
options($("day"), [...new Set(SESSIONS.map((s) => s.day))].sort().reverse(), "All days");

function visible() {
  const term = $("search").value.trim().toLowerCase();
  const character = $("character").value;
  const day = $("day").value;

  const rows = SESSIONS.filter((session) =>
    (!character || session.character === character) &&
    (!day || session.day === day) &&
    (!term || `${session.instance} ${session.character} ${session.difficulty}`.toLowerCase().includes(term)));

  const column = COLUMNS.find((entry) => entry.key === sortKey) || COLUMNS[0];
  return rows.sort((left, right) => {
    const a = column.sort(left), b = column.sort(right);
    if (a === b) return left.id < right.id ? -1 : 1;
    return (a > b ? 1 : -1) * (ascending ? 1 : -1);
  });
}

function draw() {
  const rows = visible();

  $("head").innerHTML = COLUMNS.map((column) => {
    const arrow = column.key === sortKey ? `<span class="arrow">${ascending ? "▲" : "▼"}</span>` : "";
    return `<th data-key="${column.key}"${column.num ? ' class="num"' : ""}>${escapeHtml(column.title)} ${arrow}</th>`;
  }).join("");

  $("head").querySelectorAll("th").forEach((cell) => {
    cell.addEventListener("click", () => {
      const key = cell.dataset.key;
      if (key === sortKey) ascending = !ascending;
      else { sortKey = key; ascending = false; }
      draw();
    });
  });

  $("rows").innerHTML = rows.map((session) =>
    `<tr>${COLUMNS.map((column) => `<td${column.num ? ' class="num"' : ""}>${column.cell(session)}</td>`).join("")}</tr>`).join("");

  $("count").textContent = `${rows.length} of ${SESSIONS.length} sessions`;
  const empty = $("empty");
  empty.hidden = rows.length > 0;
  empty.textContent = SESSIONS.length ? "No sessions match those filters." : "No sessions collected yet.";
}

["search", "character", "day"].forEach((id) => $(id).addEventListener("input", draw));
draw();
</script>
</body>
</html>
